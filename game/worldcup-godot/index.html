<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工位突围：世界杯摸鱼版</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff7ed;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid #fed7aa;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 20px;
        color: #6b7280;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        background: #f97316;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
    <script>
      window.setTimeout(() => {
        window.location.replace("../worldcup/");
      }, 1000);
    </script>
  </head>
  <body>
    <main>
      <h1>工位突围：世界杯摸鱼版</h1>
      <p>Godot 预览版正在修复，已为你切回稳定 H5 版本。</p>
      <a href="../worldcup/">立即进入游戏</a>
    </main>
  </body>
</html>
