<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://156-238-232-37.sslip.io http://156.238.232.37 https://api.gewuji.dev; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <title>知铺管理台</title>
    <link rel="stylesheet" href="./styles.css?v=20260621-credits-preset" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">GEWUJI · 知铺</p>
        <h1>知铺管理台</h1>
        <p>给用户人工加额度，或生成兑换码后发给用户自助兑换。</p>
      </header>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>连接设置</h2>
            <p>API 地址会保存，管理员密钥只保存在当前浏览器会话里。</p>
          </div>
          <button id="saveSettings" type="button">保存</button>
        </div>
        <div class="grid two">
          <label>
            API 地址
            <input id="apiBaseUrl" placeholder="https://156-238-232-37.sslip.io" />
          </label>
          <label>
            管理员密钥
            <input id="adminSecret" type="password" placeholder="OFFICIAL_ADMIN_SECRET" />
          </label>
        </div>
      </section>

      <section class="grid two">
        <form id="grantForm" class="panel">
          <div class="panel-head">
            <div>
              <h2>直接加额度</h2>
              <p>适合用户已经注册，并且你已经收到款。</p>
            </div>
          </div>
          <label>
            用户手机号或邮箱
            <input name="loginId" required placeholder="user@example.com" />
          </label>
          <div class="grid two compact">
            <label>
              额度
              <input name="credits" required type="number" min="1" value="100" />
            </label>
            <label>
              版本
              <select name="plan">
                <option value="pro">专业版</option>
                <option value="team">团队版</option>
                <option value="trial">试用版</option>
              </select>
            </label>
          </div>
          <label>
            备注
            <input name="title" value="人工开通" />
          </label>
          <button type="submit">确认加额度</button>
        </form>

        <form id="codeForm" class="panel">
          <div class="panel-head">
            <div>
              <h2>生成兑换码</h2>
              <p>适合用户还没打开页面，或你想先发码。</p>
            </div>
          </div>
          <div class="grid two compact">
            <label>
              额度
              <input name="credits" required type="number" min="1" value="100" />
            </label>
            <label>
              有效天数
              <input name="expiresInDays" required type="number" min="1" value="30" />
            </label>
          </div>
          <div class="quick-actions">
            <button type="button" data-code-preset="100">基础包 100 点</button>
            <button type="button" data-code-preset="300">进阶包 300 点</button>
          </div>
          <label>
            版本
            <select name="plan">
              <option value="pro">专业版</option>
              <option value="team">团队版</option>
              <option value="trial">试用版</option>
            </select>
          </label>
          <label>
            自定义兑换码，可不填
            <input name="code" placeholder="GEWUJI-XXXX-XXXX" />
          </label>
          <button type="submit">生成兑换码</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>操作结果</h2>
            <p>生成兑换码后，手机上点复制即可发给用户。</p>
          </div>
          <div class="result-actions">
            <button id="copyCode" type="button">复制兑换码</button>
            <button id="copyResult" type="button">复制全部</button>
          </div>
        </div>
        <p id="status" class="status">等待操作。</p>
        <pre id="result">等待操作。</pre>
      </section>
    </main>

    <script src="./script.js?v=20260621-admin-hardening"></script>
  </body>
</html>
