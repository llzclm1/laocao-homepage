<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>访问统计 · 老曹造物集</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10232d;
        --muted: #657987;
        --line: rgba(31, 93, 114, 0.14);
        --blue: #176fd4;
        --teal: #0da5a8;
        --graphite: #173240;
        --shadow: 0 26px 90px rgba(28, 79, 104, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(248, 252, 253, 0.98), rgba(241, 248, 249, 0.92) 48%, #fff),
          linear-gradient(115deg, rgba(23, 111, 212, 0.06), transparent 34%, rgba(201, 133, 53, 0.08) 84%),
          #f8fbfc;
        font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        background-image:
          linear-gradient(rgba(23, 50, 64, 0.024) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 50, 64, 0.022) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.46), transparent 70%);
        content: "";
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        width: min(760px, calc(100% - 32px));
        padding: 56px 0;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 8px;
        padding: clamp(22px, 5vw, 34px);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(240, 248, 249, 0.76)),
          rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #216d84;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.02;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .gate {
        display: grid;
        gap: 12px;
        margin-top: 26px;
      }

      label {
        color: #315766;
        font-size: 13px;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.72);
        font: inherit;
        font-weight: 700;
      }

      button,
      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 12px 18px;
        color: #fff;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 44%),
          linear-gradient(135deg, var(--blue), var(--teal));
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 16px 42px rgba(23, 111, 212, 0.24);
      }

      .error {
        min-height: 24px;
        margin: 0;
        color: #a64242;
        font-size: 14px;
        font-weight: 700;
      }

      .stats {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 28px;
      }

      .stats.enabled {
        display: grid;
      }

      .stat-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.66);
      }

      .stat-card strong {
        display: block;
        font-size: clamp(34px, 7vw, 54px);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .stat-card span {
        display: block;
        margin-top: 9px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      .ghost {
        color: var(--graphite);
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: none;
      }

      @media (max-width: 560px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="stats-title">
        <p class="eyebrow">Private Stats</p>
        <h1 id="stats-title">访问统计</h1>
        <p>这个页面不在主页展示，也不会被搜索引擎索引。输入当天日期口令后查看老曹造物集的访问数据，例如 6 月 13 日输入 0613。</p>

        <form class="gate" id="stats-gate">
          <label for="stats-password">查看口令</label>
          <input id="stats-password" name="password" type="password" autocomplete="current-password" />
          <button type="submit">查看统计</button>
          <p class="error" id="stats-error" aria-live="polite"></p>
        </form>

        <div class="stats" id="stats-panel" aria-live="polite">
          <div class="stat-card">
            <strong id="busuanzi_value_site_uv">--</strong>
            <span>访问人数</span>
          </div>
          <div class="stat-card">
            <strong id="busuanzi_value_site_pv">--</strong>
            <span>总访问量</span>
          </div>
        </div>

        <div class="actions">
          <a class="button ghost" href="/">回到主页</a>
        </div>
      </section>
    </main>

    <script>
      const gate = document.querySelector("#stats-gate");
      const input = document.querySelector("#stats-password");
      const error = document.querySelector("#stats-error");
      const panel = document.querySelector("#stats-panel");
      const sessionKey = "laocao_stats_session";

      const getTodayPassword = () => {
        const today = new Date();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");
        return `${month}${day}`;
      };

      const loadCounter = () => {
        gate.hidden = true;
        panel.classList.add("enabled");

        if (!document.querySelector('script[src="https://vercount.one/js"]')) {
          const script = document.createElement("script");
          script.src = "https://vercount.one/js";
          script.defer = true;
          document.body.append(script);
        }
      };

      if (sessionStorage.getItem(sessionKey) === "1") {
        loadCounter();
      }

      gate.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";

        if (input.value.trim() !== getTodayPassword()) {
          error.textContent = "口令不对。";
          input.select();
          return;
        }

        sessionStorage.setItem(sessionKey, "1");
        loadCounter();
      });
    </script>
  </body>
</html>
