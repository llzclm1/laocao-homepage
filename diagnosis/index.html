<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="格物集老曹提供外贸工厂海外客户开发资料和销售沟通小范围诊断，帮助梳理产品介绍、开发信、报价说明和询盘回复。"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://gewuji.dev/diagnosis/" />
    <title>免费诊断｜格物集老曹</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .diagnosis-page {
        width: min(960px, calc(100% - 44px));
        margin: 0 auto;
        padding: 92px 0 84px;
      }

      .diagnosis-hero,
      .diagnosis-form {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel-strong);
        box-shadow: var(--shadow-tight);
      }

      .diagnosis-hero {
        padding: clamp(28px, 5vw, 54px);
      }

      .diagnosis-hero h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(34px, 6vw, 64px);
        line-height: 1.06;
      }

      .diagnosis-hero p {
        max-width: 760px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }

      .diagnosis-form {
        display: grid;
        gap: 18px;
        margin-top: 22px;
        padding: clamp(22px, 4vw, 34px);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .diagnosis-form label {
        display: grid;
        gap: 7px;
        color: #26313d;
        font-size: 14px;
        font-weight: 800;
      }

      .diagnosis-form .wide {
        grid-column: 1 / -1;
      }

      .diagnosis-form input,
      .diagnosis-form textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 13px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .diagnosis-form textarea {
        resize: vertical;
      }

      .form-note,
      .form-status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .form-status[data-state="success"] {
        color: #176345;
      }

      .form-status[data-state="error"] {
        color: #a23625;
      }

      .honeypot {
        position: absolute;
        left: -9999px;
      }

      @media (max-width: 760px) {
        .field-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../">格物集</a>
      <nav class="nav" aria-label="页面导航">
        <a href="../#projects">项目</a>
        <a href="../#contact">联系</a>
      </nav>
    </header>

    <main class="diagnosis-page">
      <section class="diagnosis-hero">
        <p class="eyebrow">Free Diagnosis</p>
        <h1>产品不错，但海外客户为什么没有继续问？</h1>
        <p>
          发我一份产品介绍、开发信、报价说明或询盘回复样例。我先做一次小范围诊断，看哪些地方影响客户理解、信任和继续推进。
        </p>
      </section>

      <form class="diagnosis-form" id="diagnosis-form">
        <div class="field-grid">
          <label>
            公司名 *
            <input name="company_name" autocomplete="organization" required />
          </label>
          <label>
            联系人
            <input name="contact_name" autocomplete="name" />
          </label>
          <label>
            邮箱
            <input name="email" type="email" autocomplete="email" />
          </label>
          <label>
            微信
            <input name="wechat" autocomplete="off" />
          </label>
          <label>
            主营产品
            <input name="product_line" placeholder="例如：五金件、包装材料、电子配件" />
          </label>
          <label>
            官网或店铺链接
            <input name="website_url" type="url" placeholder="https://" />
          </label>
          <label class="wide">
            资料链接
            <input name="material_url" type="url" placeholder="产品册、网盘、现有英文资料链接" />
          </label>
          <label class="wide">
            现在最想解决的问题 *
            <textarea name="pain_point" rows="5" required placeholder="例如：客户看完资料不回复、报价后没下文、开发信打开率低、优势讲不清楚"></textarea>
          </label>
          <label class="wide">
            补充说明
            <textarea name="notes" rows="4" placeholder="可以贴一小段现有英文介绍或询盘回复"></textarea>
          </label>
        </div>
        <label class="honeypot">
          网站
          <input name="website" tabindex="-1" autocomplete="off" />
        </label>
        <p class="form-note">邮箱或微信至少填一个。不承诺一定带来订单，只先判断资料和沟通链路哪里不清楚。</p>
        <button class="button primary" type="submit">提交诊断需求</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="site-footer">
      <span>© 2026 格物集 · 老曹</span>
      <a href="../">回到首页</a>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
