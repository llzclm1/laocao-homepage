<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gewuji Market Validation Console</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#d9e1ea; --bg:#f4f6f8; --panel:#fff; --green:#176b52; --blue:#315ea8; --amber:#9a5b10; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header, main { width:min(1120px, calc(100% - 36px)); margin:0 auto; }
    header { align-items:flex-start; display:flex; justify-content:space-between; gap:20px; padding:28px 0 14px; }
    h1, h2, h3, p { margin:0; }
    h1 { font-size:30px; line-height:1.15; }
    h2 { font-size:19px; }
    h3 { font-size:16px; line-height:1.35; }
    main { display:grid; gap:16px; padding:10px 0 46px; }
    .meta { color:var(--muted); }
    .panel, .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    .panel { padding:18px; }
    .cards { display:grid; gap:12px; grid-template-columns:repeat(3, minmax(0, 1fr)); margin-top:14px; }
    .card { min-width:0; padding:14px; }
    .head { align-items:flex-start; display:flex; gap:12px; justify-content:space-between; }
    .pill { background:#eef4ff; border-radius:999px; color:var(--blue); display:inline-block; font-size:12px; font-weight:800; padding:3px 8px; white-space:nowrap; }
    .pill.green { background:#ecfdf3; color:var(--green); }
    .pill.amber { background:#fff7e8; color:var(--amber); }
    .north-star { border-left:4px solid var(--green); }
    .north-star strong { display:block; font-size:22px; margin-top:8px; }
    .funnel { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .funnel span { align-items:center; display:flex; gap:8px; }
    .funnel span:not(:last-child)::after { color:var(--muted); content:"→"; }
    .platform-card { border-top:3px solid var(--green); }
    .platform-card.secondary { border-top-color:var(--blue); }
    .platform-card.low { border-top-color:#98a2b3; }
    .platform-card ul { margin:10px 0 0; padding-left:18px; }
    .platform-card li { margin:4px 0; }
    .signal-grid { display:grid; gap:10px; grid-template-columns:repeat(3, minmax(0, 1fr)); margin-top:14px; }
    .signal-box { background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:12px; }
    .signal-box strong { display:block; margin-bottom:4px; }
    .facts { display:grid; gap:6px; margin-top:12px; }
    .draft { background:#f8fafc; border-left:3px solid var(--blue); margin-top:12px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { background:#f8fafc; border:1px dashed var(--line); border-radius:8px; color:var(--muted); margin-top:14px; padding:18px; }
    .form-grid { display:grid; gap:10px; grid-template-columns:repeat(2, minmax(0, 1fr)); margin-top:12px; }
    .form-grid .wide { grid-column:1 / -1; }
    textarea, input, select { border:1px solid var(--line); border-radius:6px; font:inherit; padding:9px 10px; width:100%; }
    button, .button { background:var(--ink); border:0; border-radius:6px; color:#fff; cursor:pointer; display:inline-block; font:inherit; font-weight:750; padding:9px 12px; text-decoration:none; }
    button.secondary, .button.secondary { background:#fff; border:1px solid var(--line); color:var(--ink); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #f2c14e; outline-offset:2px; }
    .actions { align-items:center; display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    details { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
    summary { cursor:pointer; font-weight:750; }
    .error { background:#fef3f2; border:1px solid #fecdca; border-radius:8px; color:var(--red); padding:14px; }
    .status { min-height:20px; }
    .server { align-items:center; display:flex; gap:8px; }
    .dot { background:var(--green); border-radius:50%; height:8px; width:8px; }
    .dot.offline { background:var(--red); }
    @media (max-width:820px) { .cards, .signal-grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:620px) { header { flex-direction:column; } .cards, .signal-grid, .form-grid { grid-template-columns:1fr; } .form-grid .wide { grid-column:auto; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Market Validation Console</h1>
      <p class="meta" id="generatedAt">读取本地数据中...</p>
    </div>
    <div class="server"><span class="dot" id="serverDot"></span><span class="meta" id="serverStatus">Local server</span><button type="button" class="secondary" id="reload">刷新</button></div>
  </header>

  <main id="app"><section class="panel">加载中...</section></main>

  <script>
    const viewUrl = "/data/social-agent/view.json";
    const manualUrl = "/__manual-discovery";
    const publishedUrl = "/__social-agent-draft-published";
    const app = document.getElementById("app");
    const strategies = {
      LinkedIn: { role:"Buyer Relationship Engine", priority:"P0", goal:"有效回复、关系建立、提交材料", rule:"评论优先；不自动私信或发布。" },
      Quora: { role:"Search Intent Content Engine", priority:"P1", goal:"高意图问题、搜索访问、站内动作", rule:"只回答付款、样品、MOQ、报价和供应商沟通问题。" },
      Reddit: { role:"Buyer Language Mining + Trust", priority:"P1", goal:"回复存活、真实追问、买家语言", rule:"不提品牌、不放链接、不 CTA。" },
      Medium: { role:"Authority / GEO Asset", priority:"P2", goal:"已验证主题的长期阅读与引用", rule:"只沉淀已有真实问题支持的主题。" },
      X: { role:"Build in Public", priority:"P3", goal:"观点反馈与主页访问", rule:"低频，不承担询盘目标。" },
      Substack: { role:"Long-term Audience Asset", priority:"P3", goal:"订阅与主动回复", rule:"低频归档，不单独运营。" }
    };
    let state = null;

    load();
    document.getElementById("reload").addEventListener("click", load);

    async function load() {
      try {
        const response = await fetch(`${viewUrl}?t=${Date.now()}`, { cache:"no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state = await response.json();
        document.getElementById("generatedAt").textContent = `Operator Mode · Last data update: ${formatDate(state.generated_at)}`;
        setServerStatus(true);
        render();
      } catch {
        setServerStatus(false);
        app.innerHTML = `<section class="error">Local Growth OS server is not available. Changes cannot be saved.</section>`;
      }
    }

    function render() {
      app.innerHTML = `${renderNorthStar()}${renderDailyCheck()}${renderPlatforms()}${renderSignals()}${renderReviewQueue()}${renderBoundaries()}`;
    }

    function renderNorthStar() {
      return `<section class="panel north-star"><span class="pill green">唯一北极星</span><strong>First Qualified Buyer Submission</strong><p class="meta">海外买家主动提交 supplier reply、quotation、payment request、sample issue 或 customization discussion。</p><div class="funnel"><span>Traffic Source</span><span>Core Page Visit</span><span>Understand Value</span><span>CTA Click</span><span>Submission</span><span>Delivery</span><span>Case / Content Flywheel</span></div></section>`;
    }

    function renderDailyCheck() {
      return `<section class="panel"><div class="head"><div><h2>Today · Signal → Meaning → Decision</h2><p class="meta">没有真实信号时不创建新功能、不扩展 Dashboard、不批量生产内容。</p></div><a class="button secondary" href="/docs/growth-os/validation/supplier-reply-review-validation-2026-07.md" target="_blank" rel="noopener noreferrer">打开验证记录</a></div><div class="signal-grid"><div class="signal-box"><strong>Signal</strong><span class="meta">目标市场访问、核心页面阅读、CTA、提交或真实买家问题。</span></div><div class="signal-box"><strong>Meaning</strong><span class="meta">它说明了哪个漏斗环节有效或受阻？证据不足就标记“待验证”。</span></div><div class="signal-box"><strong>Decision</strong><span class="meta">每周最多 1–3 个实验，必须包含 Hypothesis、Metric 和 Decision Rule。</span></div></div></section>`;
    }

    function renderPlatforms() {
      return `<section class="panel"><div class="head"><div><h2>Platform Operating Rules</h2><p class="meta">平台各有任务，不再使用通用采集、通用评分或通用回复模板。</p></div><span class="pill">Human review required</span></div><div class="cards">${Object.entries(strategies).map(([platform, item]) => `<article class="card platform-card ${item.priority === "P1" ? "secondary" : item.priority === "P0" ? "" : "low"}"><div class="head"><h3>${escapeHtml(platform)}</h3><span class="pill">${escapeHtml(item.priority)}</span></div><p style="margin-top:8px;"><strong>${escapeHtml(item.role)}</strong></p><ul><li>${escapeHtml(item.goal)}</li><li>${escapeHtml(item.rule)}</li></ul></article>`).join("")}</div></section>`;
    }

    function renderSignals() {
      const items = state.opportunities || [];
      const grouped = groupByPlatform(items);
      return `<section class="panel"><div class="head"><div><h2>Verified External Signals</h2><p class="meta">只保留真实公开 URL。机会数量不是 KPI，问题质量和买家阶段更重要。</p></div><span class="pill">${items.length} 条</span></div>${items.length ? Object.entries(grouped).map(([platform, rows]) => `<details open><summary>${escapeHtml(platform)} · ${rows.length}</summary><div class="cards">${rows.map(renderOpportunity).join("")}</div></details>`).join("") : `<div class="empty">当前没有新的真实外部信号。不要用模拟数据填充。</div>`}<details><summary>人工加入真实问题</summary><p class="meta" style="margin-top:8px;">只粘贴已人工确认的公开帖子。系统不会登录、发布、评论或私信。</p>${renderManualForm()}</details></section>`;
    }

    function renderOpportunity(item) {
      const strategy = strategies[normalizePlatform(item.platform)] || { role:"Manual research", rule:"人工判断后再行动。" };
      return `<article class="card"><div class="head"><div><span class="pill">${escapeHtml(item.platform)}</span><h3 style="margin-top:8px;">${escapeHtml(item.title)}</h3></div></div><div class="facts"><p><strong>Platform role:</strong> ${escapeHtml(strategy.role)}</p><p><strong>Topic:</strong> ${escapeHtml(item.topic)}</p><p><strong>Author:</strong> ${escapeHtml(item.author || "Not recorded")}</p><p><strong>Rule:</strong> ${escapeHtml(strategy.rule)}</p></div><div class="draft"><strong>Candidate draft · Human review required</strong><br>${escapeHtml(item.suggested_reply)}</div><div class="actions"><a class="button secondary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">Open Original</a><button type="button" class="secondary" data-copy-opportunity="${escapeHtml(item.id)}">Copy draft</button></div><p class="meta status"></p></article>`;
    }

    function renderManualForm() {
      return `<form id="manualForm" class="form-grid"><label class="wide"><span class="meta">Public URL</span><input required name="url" type="url" placeholder="https://..."></label><label><span class="meta">Platform</span><select name="platform"><option value="">Detect from URL</option><option>LinkedIn</option><option>Reddit</option><option>Quora</option><option>X</option><option>Medium</option></select></label><label><span class="meta">Buyer question / topic</span><input required name="topic" placeholder="What is the buyer asking?"></label><label class="wide"><span class="meta">Author or role (optional)</span><input name="author" placeholder="Amazon seller, importer, procurement manager..."></label><label class="wide"><span class="meta">Evidence note (optional)</span><input name="note" placeholder="Why this is a real buyer signal"></label><div class="wide"><button type="submit">Add verified signal</button><span class="meta status" id="manualStatus" style="margin-left:8px;"></span></div></form>`;
    }

    function renderReviewQueue() {
      const items = state.drafts || [];
      return `<section class="panel"><div class="head"><div><h2>Human Review Queue</h2><p class="meta">旧草稿保留供人工判断。Approve 只代表可手动执行，不触发自动发布。</p></div><span class="pill amber">${items.length} 份待判断</span></div>${items.length ? `<div class="cards">${items.map(renderDraft).join("")}</div>` : `<div class="empty">当前没有待人工审核内容。</div>`}</section>`;
    }

    function renderDraft(item) {
      const strategy = strategies[normalizePlatform(item.platform)] || { role:"Manual review", rule:"人工判断后再行动。" };
      return `<article class="card"><div class="head"><div><span class="pill">${escapeHtml(item.platform)}</span><h3 style="margin-top:8px;">${escapeHtml(item.title)}</h3></div>${item.published ? `<span class="pill green">已人工发布</span>` : ""}</div><p class="meta" style="margin-top:8px;">${escapeHtml(strategy.role)} · ${escapeHtml(strategy.rule)}</p><div class="draft">${escapeHtml(item.draft)}</div><div class="actions"><button type="button" class="secondary" data-copy-draft="${escapeHtml(item.id)}">Copy</button><a class="button secondary" href="${escapeHtml(item.publish_url)}" target="_blank" rel="noopener noreferrer">Open ${escapeHtml(item.platform)}</a>${item.published ? "" : `<button type="button" data-mark-published="${escapeHtml(item.id)}">Record manual publish</button>`}</div><p class="meta status"></p></article>`;
    }

    function renderBoundaries() {
      return `<section class="panel"><h2>Frozen for 30 Days</h2><p class="meta" style="margin-top:8px;">不新增 Dashboard、Growth OS 模块、采集器、平台接入、自动评论、自动发布、自动私信或批量 Buyer Guide。只有真实用户行为证明流程受阻时才开发。</p></section>`;
    }

    function groupByPlatform(items) { return items.reduce((groups, item) => { const key = normalizePlatform(item.platform); (groups[key] ||= []).push(item); return groups; }, {}); }
    function normalizePlatform(value) { const name = String(value || "Unknown").toLowerCase(); if (name.includes("linkedin")) return "LinkedIn"; if (name.includes("reddit")) return "Reddit"; if (name.includes("quora")) return "Quora"; if (name.includes("medium")) return "Medium"; if (name === "x" || name.includes("twitter")) return "X"; if (name.includes("substack")) return "Substack"; return value || "Unknown"; }

    document.addEventListener("submit", async (event) => { if (event.target.id === "manualForm") { event.preventDefault(); await saveManual(event.target); } });
    document.addEventListener("click", async (event) => {
      const opportunity = event.target.closest("[data-copy-opportunity]");
      if (opportunity) return copyText((state.opportunities || []).find((item) => item.id === opportunity.dataset.copyOpportunity)?.suggested_reply, opportunity.closest(".card"));
      const draft = event.target.closest("[data-copy-draft]");
      if (draft) return copyText((state.drafts || []).find((item) => item.id === draft.dataset.copyDraft)?.draft, draft.closest(".card"));
      const mark = event.target.closest("[data-mark-published]");
      if (mark) await markPublished(mark);
    });

    async function saveManual(form) { const status = document.getElementById("manualStatus"); const result = await post(manualUrl, Object.fromEntries(new FormData(form)), status); if (result) { status.textContent = result.added?.length ? "已加入真实信号列表。" : "该公开链接已存在。"; await load(); } }
    async function markPublished(button) { const card = button.closest(".card"); const status = card.querySelector(".status"); const result = await post(publishedUrl, { draft_id:button.dataset.markPublished }, status); if (result) { status.textContent = "已记录人工发布。"; await load(); } }
    async function post(url, body, status) { try { const response = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) }); if (!response.ok) throw new Error(await response.text()); return response.json(); } catch { status.textContent = "Local Growth OS server is not available. Changes cannot be saved."; return null; } }
    async function copyText(text, card) { const status = card.querySelector(".status"); try { await navigator.clipboard.writeText(text || ""); status.textContent = "已复制，发布前仍需人工审核。"; } catch { status.textContent = "复制失败，请手动选择文本。"; } }
    function setServerStatus(online) { document.getElementById("serverDot").classList.toggle("offline", !online); document.getElementById("serverStatus").textContent = online ? "Local operator console available" : "Local server unavailable"; }
    function formatDate(value) { return value ? new Date(value).toLocaleString() : "unknown"; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char])); }
  </script>
</body>
</html>
