<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Content Agent</title>
  <style>
    :root { --ink:#152033; --muted:#65758b; --line:#dce5ef; --bg:#f6f8fb; --panel:#fff; --blue:#2563eb; --green:#0f766e; --amber:#b45309; --red:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header, main { width:min(1120px, calc(100% - 36px)); margin:0 auto; }
    header { align-items:flex-start; display:flex; justify-content:space-between; gap:20px; padding:28px 0 14px; }
    h1, h2, h3, p { margin:0; }
    h1 { font-size:32px; line-height:1.15; }
    h2 { font-size:20px; }
    h3 { font-size:16px; line-height:1.35; }
    main { display:grid; gap:16px; padding:10px 0 46px; }
    .meta { color:var(--muted); }
    .panel, .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .panel { padding:18px; }
    .cards { display:grid; gap:12px; grid-template-columns:repeat(2, minmax(0, 1fr)); margin-top:14px; }
    .card { min-width:0; padding:14px; }
    .head { align-items:flex-start; display:flex; gap:12px; justify-content:space-between; }
    .pill { background:#eef2ff; border-radius:999px; color:var(--blue); display:inline-block; font-size:12px; font-weight:800; padding:3px 8px; white-space:nowrap; }
    .pill.published { background:#ecfdf5; color:var(--green); }
    .keyword-grid { display:grid; gap:12px; grid-template-columns:minmax(0, 1fr) auto; margin-top:12px; }
    textarea, input, select { border:1px solid var(--line); border-radius:8px; font:inherit; padding:9px 10px; width:100%; }
    textarea { min-height:132px; resize:vertical; }
    button, .button { background:var(--ink); border:0; border-radius:8px; color:#fff; cursor:pointer; display:inline-block; font:inherit; font-weight:750; padding:9px 12px; text-decoration:none; }
    button.secondary, .button.secondary { background:#fff; border:1px solid var(--line); color:var(--ink); }
    button.quiet { background:transparent; color:var(--blue); padding:6px 0; }
    .actions { align-items:center; display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .facts { display:grid; gap:6px; margin-top:12px; }
    .facts p { overflow-wrap:anywhere; }
    .draft { background:#f8fafc; border-left:3px solid var(--blue); margin-top:12px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { background:#f8fafc; border:1px dashed var(--line); border-radius:8px; color:var(--muted); padding:18px; }
    .form-grid { display:grid; gap:10px; grid-template-columns:repeat(2, minmax(0, 1fr)); margin-top:12px; }
    .form-grid .wide { grid-column:1 / -1; }
    details { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
    summary { cursor:pointer; font-weight:750; }
    .debug { background:#f8fafc; border-radius:8px; margin-top:10px; padding:12px; }
    .error { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; color:var(--red); padding:14px; }
    .status { min-height:20px; }
    .server { align-items:center; display:flex; gap:8px; }
    .dot { background:var(--green); border-radius:50%; height:8px; width:8px; }
    .dot.offline { background:var(--red); }
    @media (max-width:760px) { header { flex-direction:column; } .cards, .form-grid, .keyword-grid { grid-template-columns:1fr; } .form-grid .wide { grid-column:auto; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Social Content Agent</h1>
      <p class="meta" id="generatedAt">读取本地数据中...</p>
    </div>
    <div class="server"><span class="dot" id="serverDot"></span><span class="meta" id="serverStatus">Local server</span><button type="button" id="runAgent">Generate</button><button type="button" class="secondary" id="reload">刷新</button></div>
  </header>

  <main id="app"><section class="panel">加载中...</section></main>

  <script>
    const viewUrl = "/data/social-agent/view.json";
    const keywordsUrl = "/__social-agent-keywords";
    const manualUrl = "/__manual-discovery";
    const publishedUrl = "/__social-agent-draft-published";
    const runUrl = "/__social-agent-run";
    const app = document.getElementById("app");
    let state = null;

    load();
    document.getElementById("reload").addEventListener("click", load);
    document.getElementById("runAgent").addEventListener("click", runAgent);

    async function load() {
      try {
        const response = await fetch(`${viewUrl}?t=${Date.now()}`, { cache:"no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state = await response.json();
        document.getElementById("generatedAt").textContent = `Last updated: ${formatDate(state.generated_at)}`;
        setServerStatus(true);
        render();
      } catch {
        setServerStatus(false);
        app.innerHTML = `<section class="error">Local Social Content Agent server is not available. Changes cannot be saved.</section>`;
      }
    }

    function render() {
      app.innerHTML = `${renderKeywords()}${renderOpportunities()}${renderDrafts()}${renderDebug()}`;
    }

    function renderKeywords() {
      return `<section class="panel">
        <div class="head"><div><h2>Keywords</h2><p class="meta">一行一个关键词。保存后用于下一轮公开内容筛选与草稿主题。</p></div></div>
        <form id="keywordsForm"><div class="keyword-grid"><textarea name="keywords" aria-label="Keywords">${escapeHtml((state.keywords || []).join("\n"))}</textarea><div><button type="submit">保存关键词</button><p class="meta status" id="keywordsStatus" style="margin-top:8px;"></p></div></div></form>
      </section>`;
    }

    function renderOpportunities() {
      const items = state.opportunities || [];
      return `<section class="panel">
        <div class="head"><div><h2>Opportunities</h2><p class="meta">仅显示真实公开 HTTPS 链接。每个平台最多 3 条，总计最多 10 条。</p></div><span class="pill">${items.length} 条</span></div>
        ${renderRedditTrust()}
        ${items.length ? `<div class="cards">${items.map(renderOpportunity).join("")}</div>` : `<div class="empty" style="margin-top:14px;">当前没有新的可处理公开机会。系统不会用假 URL 或旧状态填充。</div>`}
        <details><summary>粘贴公开链接</summary><p class="meta" style="margin-top:8px;">用于 LinkedIn、Reddit、Quora、X 或 Facebook 的公开帖子。不会登录、读取私信或自动互动。</p>${renderManualForm()}</details>
      </section>`;
    }

    function renderRedditTrust() {
      const trust = state.reddit_trust || {};
      const metrics = trust.metrics || {};
      return `<div class="card" style="margin-top:14px;"><div class="head"><div><h3>Reddit · Trust Building</h3><p class="meta">Mode: ${escapeHtml(trust.mode || "trust_building")} · Goal: ${escapeHtml(trust.goal || "Build account reputation")}</p></div><span class="pill">${escapeHtml(trust.target || "zero_removed_comments")}</span></div><div class="facts"><p><strong>Comments posted:</strong> ${escapeHtml(metrics.comments_posted || 0)} / ${escapeHtml(metrics.target_comments || 50)} · <strong>Removed:</strong> ${escapeHtml(metrics.removed_count || 0)} · <strong>Removal rate:</strong> ${escapeHtml(metrics.removal_rate || 0)}%</p><p><strong>Community participation:</strong> ${escapeHtml(metrics.community_participation || 0)} · Links: ${trust.link_allowed ? "Allowed" : "Not allowed"} · Promotion: ${trust.promotion_allowed ? "Allowed" : "Not allowed"}</p></div></div>`;
    }

    function renderOpportunity(item) {
      const xCount = item.platform === "X" ? `<p class="meta">X 字符数：${item.x_character_count} / 280</p>` : "";
      return `<article class="card" data-opportunity-id="${escapeHtml(item.id)}">
        <div class="head"><div><span class="pill">${escapeHtml(item.platform)}</span><h3 style="margin-top:8px;">${escapeHtml(item.title)}</h3></div></div>
        <div class="facts"><p><strong>Topic:</strong> ${escapeHtml(item.topic)}</p><p><strong>Author:</strong> ${escapeHtml(item.author)}</p><p><strong>Source:</strong> ${escapeHtml(item.source)}</p>${xCount}</div>
        <div class="draft"><strong>Suggested Reply</strong><br>${escapeHtml(item.suggested_reply)}</div>
        <div class="actions"><a class="button secondary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">Open Original</a><button type="button" class="secondary" data-copy-opportunity="${escapeHtml(item.id)}">Copy</button></div><p class="meta status"></p>
      </article>`;
    }

    function renderManualForm() {
      return `<form id="manualForm" class="form-grid"><label class="wide"><span class="meta">Public URL</span><input required name="url" type="url" placeholder="https://..."></label><label><span class="meta">Platform</span><select name="platform"><option value="">Detect from URL</option><option>LinkedIn</option><option>Reddit</option><option>Quora</option><option>X</option><option>Facebook</option></select></label><label><span class="meta">Topic</span><input required name="topic" placeholder="What is this post about?"></label><label class="wide"><span class="meta">Author (optional)</span><input name="author" placeholder="Not recorded is fine"></label><label class="wide"><span class="meta">Short note (optional)</span><input name="note" placeholder="Useful context for the reply"></label><div class="wide"><button type="submit">Add Opportunity</button><span class="meta status" id="manualStatus" style="margin-left:8px;"></span></div></form>`;
    }

    function renderDrafts() {
      const items = state.drafts || [];
      return `<section class="panel"><div class="head"><div><h2>Drafts · Manual Publish</h2><p class="meta">每日主动内容草稿。人工确认、复制并在平台手动发布；系统不会自动发帖。</p></div><span class="pill">${items.length} 份</span></div><div class="cards">${items.map(renderDraft).join("")}</div></section>`;
    }

    function renderDraft(item) {
      const count = item.platform === "X" ? `X 字符数：${item.character_count} / 280` : `英文词数：${item.word_count}`;
      return `<article class="card" data-draft-id="${escapeHtml(item.id)}"><div class="head"><div><span class="pill ${item.published ? "published" : ""}">${escapeHtml(item.platform)}</span><h3 style="margin-top:8px;">${escapeHtml(item.title)}</h3></div>${item.published ? `<span class="pill published">已标记发布</span>` : ""}</div><p class="meta" style="margin-top:8px;">${escapeHtml(item.type)} · ${escapeHtml(count)}</p><div class="draft">${escapeHtml(item.draft)}</div><div class="actions"><button type="button" class="secondary" data-copy-draft="${escapeHtml(item.id)}">Copy</button><a class="button secondary" href="${escapeHtml(item.publish_url)}" target="_blank" rel="noopener noreferrer">Open ${escapeHtml(item.platform)}</a>${item.published ? "" : `<button type="button" data-mark-published="${escapeHtml(item.id)}">Mark Published</button>`}</div><p class="meta status"></p></article>`;
    }

    function renderDebug() {
      const collection = state.collection || {};
      const sourceRows = (collection.sources || []).map((source) => `<li>${escapeHtml(source.platform)}: ${escapeHtml(source.status)}${source.message ? ` (${escapeHtml(source.message)})` : ""}</li>`).join("");
      return `<details><summary>Debug</summary><div class="debug"><p><strong>Collection:</strong> ${escapeHtml(collection.message || "Not recorded")}</p><p class="meta">${escapeHtml(state.debug?.rule || "")}</p><p class="meta">Active candidates: ${escapeHtml(state.debug?.active_candidates || 0)} · Shown: ${escapeHtml(state.debug?.selected_opportunities || 0)}</p>${sourceRows ? `<ul class="meta">${sourceRows}</ul>` : ""}</div></details>`;
    }

    document.addEventListener("submit", async (event) => {
      if (event.target.id === "keywordsForm") { event.preventDefault(); await saveKeywords(event.target); }
      if (event.target.id === "manualForm") { event.preventDefault(); await saveManual(event.target); }
    });

    document.addEventListener("click", async (event) => {
      const opportunity = event.target.closest("[data-copy-opportunity]");
      if (opportunity) return copyText((state.opportunities || []).find((item) => item.id === opportunity.dataset.copyOpportunity)?.suggested_reply, opportunity.closest(".card"));
      const draft = event.target.closest("[data-copy-draft]");
      if (draft) return copyText((state.drafts || []).find((item) => item.id === draft.dataset.copyDraft)?.draft, draft.closest(".card"));
      const mark = event.target.closest("[data-mark-published]");
      if (mark) await markPublished(mark);
    });

    async function saveKeywords(form) {
      const status = document.getElementById("keywordsStatus");
      await post(keywordsUrl, { keywords: new FormData(form).get("keywords") }, status);
    }

    async function saveManual(form) {
      const status = document.getElementById("manualStatus");
      const result = await post(manualUrl, Object.fromEntries(new FormData(form)), status);
      if (result) { status.textContent = result.added?.length ? "已加入机会列表。" : "该公开链接已存在。"; await load(); }
    }

    async function markPublished(button) {
      const card = button.closest(".card");
      const status = card.querySelector(".status");
      const result = await post(publishedUrl, { draft_id: button.dataset.markPublished }, status);
      if (result) { status.textContent = "已记录为人工发布。"; await load(); }
    }

    async function runAgent() {
      const button = document.getElementById("runAgent");
      button.disabled = true;
      button.textContent = "Generating...";
      try {
        const response = await fetch(runUrl, { method:"POST" });
        if (!response.ok) throw new Error(await response.text());
        await load();
      } catch {
        document.getElementById("serverStatus").textContent = "Local server unavailable";
      } finally {
        button.disabled = false;
        button.textContent = "Generate";
      }
    }


    async function post(url, body, status) {
      try {
        const response = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      } catch {
        status.textContent = "Local Social Content Agent server is not available. Changes cannot be saved.";
        return null;
      }
    }

    async function copyText(text, card) {
      const status = card.querySelector(".status");
      try { await navigator.clipboard.writeText(text || ""); status.textContent = "已复制。"; } catch { status.textContent = "复制失败，请手动选择文本。"; }
    }

    function setServerStatus(online) { document.getElementById("serverDot").classList.toggle("offline", !online); document.getElementById("serverStatus").textContent = online ? "Local server available" : "Local server unavailable"; }
    function formatDate(value) { return value ? new Date(value).toLocaleString() : "unknown"; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>\"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char])); }
  </script>
</body>
</html>
