<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>格物集｜Growth OS v2 控制台</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --subtle: #98a2b3;
      --line: #e5e9ef;
      --bg: #f5f7fa;
      --panel: #fff;
      --soft: #f8fafc;
      --green: #176b52;
      --green-soft: #ecfdf3;
      --blue: #315ea8;
      --blue-soft: #eef4ff;
      --amber: #9a5b10;
      --amber-soft: #fff7e8;
      --red: #b42318;
      --red-soft: #fef3f2;
      --shadow: 0 10px 28px rgba(16, 24, 40, .045);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: var(--blue); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -.03em; line-height: 1.1; }
    h2 { font-size: 20px; letter-spacing: -.02em; line-height: 1.2; }
    h3 { font-size: 15px; line-height: 1.35; }
    main, header, .nav { width: min(1240px, calc(100% - 40px)); margin: 0 auto; }
    main { display: grid; gap: 20px; padding: 18px 0 56px; }
    .meta { color: var(--muted); }
    .sr-only { height: 1px; margin: -1px; overflow: hidden; position: absolute; width: 1px; clip: rect(0, 0, 0, 0); }

    header { align-items: center; display: flex; gap: 24px; justify-content: space-between; padding: 28px 0 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { align-items: center; background: var(--ink); border-radius: 10px; color: #fff; display: flex; font-size: 12px; font-weight: 850; height: 34px; justify-content: center; letter-spacing: .06em; width: 34px; }
    .brand-copy p { margin-top: 5px; }
    .server { align-items: center; display: flex; gap: 8px; white-space: nowrap; }
    .dot { background: var(--green); border-radius: 50%; height: 8px; width: 8px; }
    .dot.offline { background: var(--red); }

    button, .button { background: var(--ink); border: 0; border-radius: 7px; color: #fff; cursor: pointer; display: inline-flex; font-weight: 750; gap: 7px; justify-content: center; padding: 9px 12px; text-decoration: none; }
    button:hover, .button:hover { filter: brightness(1.05); }
    button.secondary, .button.secondary { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
    button.ghost:hover { background: var(--soft); color: var(--ink); }
    button:disabled { cursor: wait; opacity: .55; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #f2c14e; outline-offset: 2px; }

    .nav { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
    .nav a { border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 750; padding: 7px 11px; text-decoration: none; }
    .nav a:hover { background: #fff; color: var(--ink); }

    .surface { background: var(--panel); border: 1px solid rgba(229, 233, 239, .9); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; }
    .section-head { align-items: flex-start; display: flex; gap: 18px; justify-content: space-between; }
    .section-head .meta { margin-top: 5px; }
    .section-kicker { color: var(--blue); font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .section-kicker.green { color: var(--green); }
    .section-kicker.amber { color: var(--amber); }
    .section-kicker.red { color: var(--red); }
    .section-title { margin-top: 5px; }

    .kpi-grid { display: grid; gap: 10px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .kpi { background: var(--panel); border: 1px solid rgba(229, 233, 239, .9); border-radius: 12px; min-width: 0; padding: 15px 16px; }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .kpi-value { display: block; font-size: 25px; letter-spacing: -.04em; line-height: 1.1; margin-top: 8px; }
    .kpi-value.small { font-size: 16px; letter-spacing: -.02em; }
    .kpi-note { color: var(--subtle); font-size: 11px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kpi.good .kpi-value { color: var(--green); }
    .kpi.warn .kpi-value { color: var(--amber); }
    .kpi.bad .kpi-value { color: var(--red); }

    .today-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; }
    .today-lane { background: var(--soft); border: 1px solid var(--line); border-radius: 11px; min-width: 0; padding: 14px; }
    .today-lane-head { align-items: flex-start; display: flex; gap: 10px; justify-content: space-between; }
    .today-lane h3 { font-size: 14px; }
    .lane-count { align-items: center; background: #fff; border-radius: 999px; color: var(--muted); display: inline-flex; font-size: 12px; font-weight: 850; height: 25px; justify-content: center; min-width: 25px; padding: 0 7px; }
    .lane-list { display: grid; gap: 8px; margin-top: 12px; }
    .actionable-item { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .actionable-title { display: -webkit-box; font-weight: 750; line-height: 1.35; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .actionable-meta { align-items: center; display: flex; gap: 6px; margin-top: 6px; }
    .actionable-item .actions { margin-top: 9px; }
    .actionable-item .actions button { font-size: 12px; padding: 7px 9px; }
    .lane-more { color: var(--muted); font-size: 12px; margin-top: 8px; }

    .pill, .tag { align-items: center; background: var(--blue-soft); border-radius: 999px; color: var(--blue); display: inline-flex; font-size: 11px; font-weight: 800; line-height: 1; padding: 5px 8px; white-space: nowrap; }
    .pill.green, .tag.green { background: var(--green-soft); color: var(--green); }
    .pill.amber, .tag.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red, .tag.red { background: var(--red-soft); color: var(--red); }
    .pill.gray, .tag.gray { background: #f2f4f7; color: var(--muted); }
    .tag { font-size: 10px; padding: 4px 7px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }

    .queue-toolbar { align-items: center; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-top: 18px; padding-bottom: 14px; }
    .filter-group, .sort-group { align-items: center; display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-button { background: transparent; border: 1px solid transparent; color: var(--muted); font-size: 12px; padding: 7px 9px; }
    .filter-button:hover { background: var(--soft); filter: none; }
    .filter-button.active { background: var(--ink); color: #fff; }
    .hide-filters { align-items: center; display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
    .toggle { align-items: center; color: var(--muted); display: inline-flex; font-size: 12px; gap: 6px; user-select: none; }
    .toggle input { accent-color: var(--ink); height: 15px; margin: 0; width: 15px; }
    .sort-group label { color: var(--muted); font-size: 12px; }
    select { background: #fff; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); padding: 7px 9px; }
    .queue-summary { color: var(--muted); font-size: 12px; margin-top: 14px; }
    .queue-list { display: grid; gap: 7px; margin-top: 10px; }
    .queue-row { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .queue-main { align-items: center; display: grid; gap: 12px; grid-template-columns: minmax(230px, 2.2fr) minmax(90px, .8fr) minmax(110px, 1fr) 62px 92px 58px minmax(150px, auto); padding: 12px 14px; }
    .queue-cell { min-width: 0; }
    .queue-label { color: var(--subtle); display: none; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .queue-title { display: -webkit-box; font-weight: 750; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .queue-subtitle { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .queue-source { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-score, .queue-age { color: var(--muted); font-variant-numeric: tabular-nums; }
    .queue-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
    .queue-actions button { font-size: 11px; padding: 7px 8px; }
    .queue-detail { background: var(--soft); border-top: 1px solid var(--line); padding: 14px; }
    .queue-detail[hidden] { display: none; }
    .detail-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .detail-block { min-width: 0; }
    .detail-block .label { color: var(--subtle); display: block; font-size: 11px; font-weight: 800; margin-bottom: 4px; }
    .detail-copy { max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    .work-item { display: grid; gap: 14px; margin-top: 14px; }
    .work-item-section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 13px; }
    .work-item-head { align-items: center; display: flex; gap: 10px; justify-content: space-between; margin-bottom: 8px; }
    .work-item-title { font-size: 13px; font-weight: 850; }
    .work-item-missing { background: var(--soft); border-radius: 7px; color: var(--muted); padding: 10px; }
    .work-item-meta { color: var(--muted); font-size: 11px; margin-top: 7px; }
    .work-item-editor { display: grid; gap: 8px; }
    .work-item-editor textarea { background: #fff; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); min-height: 120px; padding: 10px; resize: vertical; width: 100%; }
    .work-item-editor textarea:focus { border-color: var(--blue); outline: 3px solid var(--blue-soft); }
    .work-item-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .work-item-actions button { font-size: 12px; padding: 7px 9px; }
    .published-copy { max-width: 430px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .load-more { display: flex; justify-content: center; margin-top: 14px; }
    .empty { background: var(--soft); border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); padding: 16px; text-align: center; }

    .ready-list { display: grid; gap: 8px; margin-top: 17px; }
    .ready-row { align-items: center; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 14px; grid-template-columns: minmax(0, 2fr) 1fr 1fr 1fr auto; padding: 12px 14px; }
    .ready-row .title { display: -webkit-box; font-weight: 750; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .ready-row .meta-value { color: var(--muted); font-size: 12px; }
    .ready-row .actions { justify-content: flex-end; margin: 0; }
    .ready-work-item { grid-column: 1 / -1; }
    .published-detail { margin-top: 7px; }
    .published-detail summary { color: var(--blue); cursor: pointer; font-size: 12px; }
    .published-detail .published-copy { margin-top: 7px; }

    .table-wrap { margin-top: 17px; overflow-x: auto; }
    table { border-collapse: collapse; min-width: 680px; width: 100%; }
    th { color: var(--subtle); font-size: 11px; font-weight: 850; letter-spacing: .05em; padding: 0 12px 9px; text-align: left; text-transform: uppercase; }
    td { border-top: 1px solid var(--line); padding: 12px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; }
    .table-title { display: -webkit-box; font-weight: 750; max-width: 340px; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .table-link { white-space: nowrap; }

    details.health, details.performance { background: var(--panel); border: 1px solid rgba(229, 233, 239, .9); border-radius: 14px; box-shadow: var(--shadow); padding: 0 22px; }
    details.health > summary, details.performance > summary { align-items: center; cursor: pointer; display: flex; gap: 14px; justify-content: space-between; list-style: none; padding: 18px 0; }
    details.health > summary::-webkit-details-marker, details.performance > summary::-webkit-details-marker { display: none; }
    details.health > summary::after, details.performance > summary::after { color: var(--subtle); content: "＋"; font-size: 18px; font-weight: 400; }
    details.health[open] > summary::after, details.performance[open] > summary::after { content: "−"; }
    .summary-status { align-items: center; display: flex; gap: 9px; }
    .summary-status strong { font-size: 14px; }
    .health-body, .performance-body { border-top: 1px solid var(--line); padding: 16px 0 20px; }
    .health-grid, .performance-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .health-item, .performance-item { background: var(--soft); border-radius: 9px; padding: 11px; }
    .health-item strong, .performance-item strong { display: block; font-size: 18px; margin-top: 3px; }
    .health-detail { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-top: 12px; overflow-wrap: anywhere; }
    .bar { background: #e7ebf0; border-radius: 99px; height: 6px; margin-top: 8px; overflow: hidden; }
    .bar span { background: var(--blue); border-radius: inherit; display: block; height: 100%; min-width: 3px; }
    .error { background: var(--red-soft); border: 1px solid #fecdca; border-radius: 10px; color: var(--red); padding: 16px; }
    .status-feedback { color: var(--red); font-size: 12px; min-height: 18px; margin-top: 7px; }

    @media (max-width: 1080px) {
      .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .today-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .queue-main { grid-template-columns: minmax(220px, 2fr) 1fr 1fr 60px 90px 58px auto; }
    }
    @media (max-width: 820px) {
      main, header, .nav { width: min(100% - 28px, 680px); }
      .queue-main { align-items: start; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) auto; }
      .queue-cell:nth-child(2), .queue-cell:nth-child(3), .queue-cell:nth-child(4), .queue-cell:nth-child(5), .queue-cell:nth-child(6) { display: grid; gap: 3px; }
      .queue-cell:nth-child(2) .queue-label, .queue-cell:nth-child(3) .queue-label, .queue-cell:nth-child(4) .queue-label, .queue-cell:nth-child(5) .queue-label, .queue-cell:nth-child(6) .queue-label { display: block; }
      .queue-actions { grid-column: 1 / -1; justify-content: flex-start; }
      .detail-grid, .health-grid, .performance-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ready-row { grid-template-columns: minmax(0, 2fr) 1fr auto; }
      .ready-row .meta-value:nth-child(3), .ready-row .meta-value:nth-child(4) { display: none; }
    }
    @media (max-width: 560px) {
      header { align-items: flex-start; flex-direction: column; }
      .server { width: 100%; }
      .server button { margin-left: auto; }
      .kpi-grid, .today-grid, .detail-grid, .health-grid, .performance-grid { grid-template-columns: 1fr; }
      .surface, details.health, details.performance { border-radius: 11px; padding-left: 15px; padding-right: 15px; }
      .queue-main { grid-template-columns: minmax(0, 1fr) auto; padding: 11px; }
      .queue-cell:nth-child(2), .queue-cell:nth-child(3), .queue-cell:nth-child(4), .queue-cell:nth-child(5), .queue-cell:nth-child(6) { display: none; }
      .queue-actions { grid-column: 1 / -1; }
      .ready-row { align-items: start; grid-template-columns: minmax(0, 1fr) auto; }
      .ready-row .meta-value { display: block !important; grid-column: 1 / -1; }
      .ready-row .actions { grid-column: 2; grid-row: 1 / span 2; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">GO</span>
      <div class="brand-copy">
        <h1>增长运营中心</h1>
        <p class="meta">Growth OS v2 · One trusted operator workflow</p>
      </div>
    </div>
    <div class="server">
      <span class="dot" id="serverDot"></span>
      <span class="meta" id="serverStatus">读取 v2 Unified View</span>
      <button type="button" class="secondary" id="reload">刷新</button>
    </div>
  </header>

  <nav class="nav" aria-label="增长运营中心导航">
    <a href="#today">Today</a>
    <a href="#review-queue">Review Queue</a>
    <a href="#ready-to-publish">Ready to Publish</a>
    <a href="#published">Published</a>
    <a href="#system-health">System Health</a>
  </nav>

  <main id="app"><section class="surface">加载 v2 控制台中...</section></main>

  <script>
    const viewEndpoint = "/__v2/unified-view";
    const lifecycleEndpoint = "/__v2/lifecycle";
    const contentEndpoint = "/__v2/content";
    const app = document.getElementById("app");
    const state = {
      categoryFilter: "all",
      hideHelpCenter: true,
      hidePolicy: true,
      hideAnnouncement: true,
      sort: "age",
      queueVisible: 12,
      publishedVisible: 20,
      csrfToken: null,
      actor: (() => { try { return localStorage.getItem("growth_os_actor") || "dashboard-operator"; } catch { return "dashboard-operator"; } })()
    };
    let view = null;
    let lastLoadError = null;

    load();
    document.getElementById("reload").addEventListener("click", () => load());

    async function load(options = {}) {
      try {
        await ensureCsrfToken();
        const response = await fetch(`${viewEndpoint}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        view = await response.json();
        lastLoadError = null;
        setServerStatus(true);
        render(options);
      } catch (error) {
        lastLoadError = error;
        setServerStatus(false);
        app.innerHTML = `<section class="error">v2 Unified View 不可用：${escapeHtml(error.message)}</section>`;
      }
    }

    async function ensureCsrfToken() {
      if (state.csrfToken) return;
      const response = await fetch(`/__v2/csrf?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`CSRF token unavailable (HTTP ${response.status})`);
      const result = await response.json();
      if (!result.csrf_token) throw new Error("CSRF token unavailable");
      state.csrfToken = result.csrf_token;
    }

    function render(options = {}) {
      const rows = Array.isArray(view?.items) ? view.items : [];
      const pending = rows.filter((row) => row.current_status === "pending_review");
      const approved = rows.filter((row) => row.current_status === "approved");
      const ready = rows.filter((row) => row.current_status === "ready_to_publish");
      const published = rows.filter((row) => row.current_status === "published");
      const actionRequired = rows.filter((row) => row.performance_status === "action_required");
      const publishingErrors = rows.filter((row) => row.publish_error || row.publishing_status === "error");

      const scrollY = options.preserveViewport ? window.scrollY : null;
      app.innerHTML = [
        renderHeaderKpis(rows, pending, ready),
        renderToday(pending, approved, ready, publishingErrors, actionRequired),
        renderReviewQueue(pending),
        renderReadyToPublish(ready),
        renderPublished(published),
        renderPerformance(published),
        renderSystemHealth(rows)
      ].join("");
      bindInteractions();
      if (scrollY !== null) requestAnimationFrame(() => window.scrollTo(0, scrollY));
    }

    function renderHeaderKpis(rows, pending, ready) {
      const failedJobs = view?.failed_jobs ?? view?.counts?.failed_jobs ?? null;
      const health = lastLoadError ? "Error" : publishedMetadataComplete(rows) ? "Healthy" : "Warning";
      const healthClass = health === "Healthy" ? "good" : health === "Warning" ? "warn" : "bad";
      return `<section class="kpi-grid" aria-label="Growth OS 状态摘要">
        ${kpi("Growth OS", health, healthClass, "v2 Unified View")}
        ${kpi("上次运行", formatDate(view?.generated_at), "", "Unified View 更新时间", true)}
        ${kpi("下次运行", nextSchedulerRun(), "", "预计计划时间", true)}
        ${kpi("Pending Review", pending.length, "warn", "需要人工审核")}
        ${kpi("Ready to Publish", ready.length, ready.length ? "good" : "", "等待发布")}
        ${kpi("Failed Jobs", failedJobs === null ? "—" : failedJobs, failedJobs ? "bad" : "", failedJobs === null ? "v2 View 未暴露" : "生产任务异常")}
      </section>`;
    }

    function kpi(label, value, tone, note, small = false) {
      return `<article class="kpi ${tone || ""}"><span class="kpi-label">${escapeHtml(label)}</span><strong class="kpi-value ${small ? "small" : ""}">${escapeHtml(value)}</strong><p class="kpi-note">${escapeHtml(note)}</p></article>`;
    }

    function renderToday(pending, approved, ready, publishingErrors, actionRequired) {
      const attention = [...approved, ...actionRequired];
      const lanes = [
        { title: "Pending Review", kicker: "人工审核", rows: pending, status: "pending_review", tone: "amber", empty: "没有待审核机会。" },
        { title: "Ready to Publish", kicker: "发布动作", rows: ready, status: "ready_to_publish", tone: "green", empty: "没有待发布内容。" },
        { title: "Publishing Errors", kicker: "异常", rows: publishingErrors, status: "error", tone: "red", empty: "没有发现发布错误。" },
        { title: "Requires Attention", kicker: "需要跟进", rows: attention, status: "attention", tone: "", empty: "没有需要额外关注的记录。" }
      ];
      return `<section class="surface section-anchor" id="today">
        <div class="section-head"><div><p class="section-kicker green">Today / 今日</p><h2 class="section-title">现在需要处理什么？</h2><p class="meta">只显示当前 v2 主链上的人工动作，不显示 Published 历史。</p></div><span class="pill green">${pending.length + ready.length + attention.length} 项待处理</span></div>
        <div class="today-grid">${lanes.map(renderTodayLane).join("")}</div>
      </section>`;
    }

    function renderTodayLane(lane) {
      const visible = lane.rows.slice(0, 3);
      const content = visible.length ? visible.map((row) => renderActionableItem(row, lane.status)).join("") : `<div class="empty">${lane.empty}</div>`;
      const more = lane.rows.length > visible.length ? `<p class="lane-more">另有 ${lane.rows.length - visible.length} 项，见下方列表。</p>` : "";
      return `<article class="today-lane"><div class="today-lane-head"><div><p class="section-kicker ${lane.tone}">${lane.kicker}</p><h3>${lane.title}</h3></div><span class="lane-count">${lane.rows.length}</span></div><div class="lane-list">${content}</div>${more}</article>`;
    }

    function renderActionableItem(row, laneStatus) {
      const actionStatus = laneStatus === "attention" ? row.current_status : laneStatus;
      const actions = laneStatus === "error" ? `<span class="pill red">检查发布状态</span>` : renderActions(row, actionStatus);
      return `<article class="actionable-item" data-card="${escapeHtml(row.opportunity_id)}"><p class="actionable-title">${escapeHtml(row.title || "未命名机会")}</p><div class="actionable-meta"><span class="pill ${statusTone(row.current_status)}">${escapeHtml(statusLabel(row.current_status))}</span><span class="meta">${escapeHtml(formatAge(row))}</span></div><div class="actions">${actions}</div><p class="status-feedback action-feedback"></p></article>`;
    }

    function renderReviewQueue(rows) {
      const filtered = filteredReviewRows(rows);
      const visible = filtered.slice(0, state.queueVisible);
      const content = visible.length ? visible.map(renderQueueRow).join("") : `<div class="empty">${rows.length ? "当前筛选条件下没有记录。" : "Review Queue 为空。"}</div>`;
      const loadMore = filtered.length > visible.length ? `<div class="load-more"><button type="button" class="secondary" data-load-more>加载更多（还有 ${filtered.length - visible.length} 条）</button></div>` : "";
      return `<section class="surface section-anchor" id="review-queue">
        <div class="section-head"><div><p class="section-kicker amber">Review Queue</p><h2 class="section-title">待审核机会</h2><p class="meta">紧凑显示，长正文和实现细节默认折叠。</p></div><span class="pill amber">${filtered.length} / ${rows.length}</span></div>
        <div class="queue-toolbar"><div class="filter-group" role="group" aria-label="机会类型筛选">${filterButton("all", "全部")}${filterButton("buyer", "Buyer Question")}${filterButton("supplier", "Supplier Question")}${filterButton("low", "Low Relevance")}</div><div class="sort-group"><label for="queueSort">排序</label><select id="queueSort" data-sort><option value="age" ${state.sort === "age" ? "selected" : ""}>Age</option><option value="score" ${state.sort === "score" ? "selected" : ""}>Score</option><option value="platform" ${state.sort === "platform" ? "selected" : ""}>Platform</option></select></div><div class="hide-filters"><label class="toggle"><input type="checkbox" data-hide-filter="help" ${state.hideHelpCenter ? "checked" : ""}>Hide Help Center</label><label class="toggle"><input type="checkbox" data-hide-filter="policy" ${state.hidePolicy ? "checked" : ""}>Hide Policy</label><label class="toggle"><input type="checkbox" data-hide-filter="announcement" ${state.hideAnnouncement ? "checked" : ""}>Hide Announcement</label></div></div>
        <p class="queue-summary">显示 ${visible.length} 条 · 默认隐藏 Help Center、Policy、Announcement · 每次加载最多 ${QUEUE_PAGE_SIZE} 条</p>
        <div class="queue-list">${content}</div>${loadMore}
      </section>`;
    }

    const QUEUE_PAGE_SIZE = 12;

    function filterButton(value, label) {
      return `<button type="button" class="filter-button ${state.categoryFilter === value ? "active" : ""}" data-filter="${value}" aria-pressed="${state.categoryFilter === value}">${label}</button>`;
    }

    function filteredReviewRows(rows) {
      const result = rows.filter((row) => {
        const tags = classifyRow(row);
        if (state.categoryFilter === "buyer" && !tags.includes("Buyer Question")) return false;
        if (state.categoryFilter === "supplier" && !tags.includes("Supplier Question")) return false;
        if (state.categoryFilter === "low" && !tags.includes("Low Relevance")) return false;
        if (state.hideHelpCenter && tags.includes("Help Center")) return false;
        if (state.hidePolicy && tags.includes("Policy")) return false;
        if (state.hideAnnouncement && tags.includes("Announcement")) return false;
        return true;
      });
      return result.sort((a, b) => {
        if (state.sort === "platform") return platformLabel(a).localeCompare(platformLabel(b), "en");
        if (state.sort === "score") return scoreValue(b) - scoreValue(a) || ageValue(b) - ageValue(a);
        return ageValue(b) - ageValue(a);
      });
    }

    function renderQueueRow(row) {
      const tags = classifyRow(row);
      const detailId = `detail-${row.opportunity_id}`.replace(/[^a-zA-Z0-9_-]/g, "-");
      return `<article class="queue-row" data-row-id="${escapeHtml(row.opportunity_id)}"><div class="queue-main">
        <div class="queue-cell"><span class="queue-label">Title</span><p class="queue-title">${escapeHtml(row.title || "未命名机会")}</p><div class="tag-row" style="margin-top:6px;">${tags.map((tag) => tagBadge(tag)).join("")}</div></div>
        <div class="queue-cell"><span class="queue-label">Platform</span><span class="queue-subtitle">${escapeHtml(platformLabel(row))}</span></div>
        <div class="queue-cell queue-source"><span class="queue-label">Source</span>${sourceLink(row)}</div>
        <div class="queue-cell queue-score"><span class="queue-label">Score</span>${escapeHtml(formatScore(row))}</div>
        <div class="queue-cell"><span class="queue-label">Status</span><span class="pill ${statusTone(row.current_status)}">${escapeHtml(statusLabel(row.current_status))}</span></div>
        <div class="queue-cell queue-age"><span class="queue-label">Age</span>${escapeHtml(formatAge(row))}</div>
        <div class="queue-actions"><button type="button" class="secondary" data-details-toggle="${detailId}" aria-expanded="false">展开工作项</button>${renderActions(row, "pending_review")}</div>
      </div><div class="queue-detail" id="${detailId}" hidden>${renderWorkItem(row, { includePublished: true })}<p class="status-feedback action-feedback"></p></div></article>`;
    }

    function renderReadyToPublish(rows) {
      const content = rows.length ? rows.map((row) => `<article class="ready-row" data-card="${escapeHtml(row.opportunity_id)}"><div><p class="title">${escapeHtml(row.title || "未命名机会")}</p><p class="meta-value">${escapeHtml(row.opportunity_id)} · ${escapeHtml(platformLabel(row))}</p></div><p class="meta-value">Draft status<br><strong>Ready to Publish</strong></p><p class="meta-value">Last updated<br><strong>${escapeHtml(formatDate(row.updated_at || row.status_changed_at))}</strong></p><div class="actions">${renderActions(row, "ready_to_publish")}</div><div class="ready-work-item">${renderWorkItem(row, { includeOriginal: false, includeReply: false, includePublish: true, includePublished: false })}</div><p class="status-feedback action-feedback"></p></article>`).join("") : '<div class="empty">当前没有待发布内容。</div>';
      return `<section class="surface section-anchor" id="ready-to-publish"><div class="section-head"><div><p class="section-kicker green">Ready to Publish</p><h2 class="section-title">待发布</h2><p class="meta">每条记录保留发布动作和最后更新时间。</p></div><span class="pill green">${rows.length}</span></div><div class="ready-list">${content}</div></section>`;
    }

    function renderPublished(rows) {
      const visible = rows.slice(0, state.publishedVisible);
      const content = rows.length ? `<div class="table-wrap"><table><thead><tr><th>Title</th><th>Platform</th><th>Published Time</th><th>Performance</th><th>Open Link</th></tr></thead><tbody>${visible.map((row) => `<tr><td><span class="table-title">${escapeHtml(row.title || "未命名机会")}</span><span class="meta">${escapeHtml(row.opportunity_id)}</span><details class="published-detail"><summary>查看实际正文</summary><p class="published-copy">${escapeHtml(row.content?.published_content?.content_text || "已发布正文未保存")}</p></details></td><td>${escapeHtml(platformLabel(row))}</td><td>${escapeHtml(formatDate(row.published_at))}</td><td><span class="pill ${performanceTone(row.performance_status)}">${escapeHtml(row.performance_status || "pending")}</span></td><td>${row.published_url ? `<a class="table-link" href="${escapeHtml(row.published_url)}" target="_blank" rel="noopener noreferrer">打开链接 ↗</a>` : "—"}</td></tr>`).join("")}</tbody></table></div>${rows.length > visible.length ? `<div class="load-more"><button type="button" class="secondary" data-load-published-more>加载更多（还有 ${rows.length - visible.length} 条）</button></div>` : ""}` : '<div class="empty">暂无已发布记录。</div>';
      return `<section class="surface section-anchor" id="published"><div class="section-head"><div><p class="section-kicker">Published</p><h2 class="section-title">已发布</h2><p class="meta">只显示发布事实和 Performance 状态，不混入 Today。</p></div><span class="pill">${rows.length}</span></div>${content}</section>`;
    }

    function renderWorkItem(row, options = {}) {
      const content = row.content || {};
      const includeOriginal = options.includeOriginal !== false;
      const includeReply = options.includeReply !== false;
      const includePublish = options.includePublish !== false;
      const includePublished = options.includePublished !== false;
      const sections = [];
      if (includeOriginal) {
        const original = content.original_content;
        const reason = row.evidence?.relevance?.reasons?.join("；") || row.evidence?.why_relevant || "推荐理由未保存";
        sections.push(`<section class="work-item-section"><div class="work-item-head"><span class="work-item-title">Original Question</span><span class="pill gray">${escapeHtml(original ? "已捕获" : "缺失")}</span></div>${original ? `<p class="detail-copy">${escapeHtml(original.content_text)}</p>` : '<p class="work-item-missing">原始正文未捕获</p>'}<p class="work-item-meta">平台：${escapeHtml(original?.platform || platformLabel(row))} · 来源：${sourceLink(row)} · 推荐理由：${escapeHtml(reason)}</p></section>`);
      }
      if (includeReply) sections.push(renderContentEditor(row, "reply_draft", "Reply Draft", "Copy Reply", "尚未生成回复"));
      if (includePublish) sections.push(renderContentEditor(row, "publish_draft", "Publish Draft", "Copy Content", "尚未生成发布文案", true));
      if (includePublished) {
        const published = content.published_content;
        sections.push(`<section class="work-item-section"><div class="work-item-head"><span class="work-item-title">Published Content</span><span class="pill ${published ? "green" : "gray"}">${published ? "只读事实" : "尚未发布"}</span></div>${published ? `<p class="detail-copy">${escapeHtml(published.content_text)}</p><p class="work-item-meta">平台：${escapeHtml(published.platform || row.platform || "—")} · 时间：${escapeHtml(formatDate(row.published_at))} · ${row.published_url ? `<a href="${escapeHtml(row.published_url)}" target="_blank" rel="noopener noreferrer">打开发布链接 ↗</a>` : "发布链接未保存"}</p>` : '<p class="work-item-missing">已发布正文未保存</p>'}</section>`);
      }
      return `<div class="work-item">${sections.join("")}</div>`;
    }

    function renderContentEditor(row, contentType, label, copyLabel, emptyLabel, isPublish = false) {
      const current = contentType === "reply_draft" ? row.content?.latest_reply_draft : row.content?.latest_publish_draft;
      const editorId = `content-${contentType}-${row.opportunity_id}`.replace(/[^a-zA-Z0-9_-]/g, "-");
      if (!current && isPublish) {
        return `<section class="work-item-section work-item-editor"><div class="work-item-head"><span class="work-item-title">${label}</span><span class="pill red">缺失</span></div><p class="work-item-missing">Publish Draft missing</p><button type="button" data-content-create data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}">Create Publish Draft</button><div data-content-create-shell hidden><textarea id="${editorId}" data-content-editor data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}" data-publish-content placeholder="在此创建第一版${label}"></textarea><div class="work-item-actions"><button type="button" data-content-save data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}">保存新版本</button><button type="button" class="secondary" data-content-copy data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}" disabled>${copyLabel}</button></div></div><p class="status-feedback content-feedback"></p></section>`;
      }
      return `<section class="work-item-section work-item-editor"><div class="work-item-head"><span class="work-item-title">${label}</span><span class="pill ${current ? "green" : "gray"}">${current ? `v${current.version}` : "缺失"}</span></div>${current ? `<textarea id="${editorId}" data-content-editor data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}" ${isPublish ? "data-publish-content" : ""}>${escapeHtml(current.content_text)}</textarea>` : `<p class="work-item-missing">${emptyLabel}</p><textarea id="${editorId}" data-content-editor data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}" placeholder="在此创建第一版${label}"></textarea>`}<div class="work-item-actions"><button type="button" data-content-save data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}">保存新版本</button><button type="button" class="secondary" data-content-copy data-content-type="${contentType}" data-opportunity-id="${escapeHtml(row.opportunity_id)}">${copyLabel}</button></div><p class="status-feedback content-feedback"></p></section>`;
    }

    function renderPerformance(rows) {
      const groups = rows.reduce((result, row) => { const key = row.performance_status || "pending"; result[key] = (result[key] || 0) + 1; return result; }, {});
      const total = rows.length || 1;
      const order = ["pending", "confirmed", "action_required"];
      const items = order.filter((status) => groups[status]).map((status) => `<div class="performance-item"><span class="meta">${escapeHtml(status)}</span><strong>${groups[status]}</strong><div class="bar"><span style="width:${Math.round(groups[status] / total * 100)}%"></span></div></div>`).join("");
      return `<details class="performance section-anchor" id="performance"><summary><span class="summary-status"><span class="section-kicker">Performance</span><strong>${rows.length} 条已发布记录</strong></span><span class="meta">展开摘要</span></summary><div class="performance-body">${items || '<div class="empty">暂无 Performance 记录。</div>'}</div></details>`;
    }

    function renderSystemHealth(rows) {
      const health = lastLoadError ? "Error" : publishedMetadataComplete(rows) ? "Healthy" : "Warning";
      const tone = health === "Healthy" ? "green" : health === "Warning" ? "amber" : "red";
      return `<details class="health section-anchor" id="system-health"><summary><span class="summary-status"><span class="pill ${tone}">${health}</span><strong>System Health</strong></span><span class="meta">技术详情默认隐藏</span></summary><div class="health-body"><div class="health-grid"><div class="health-item"><span class="meta">Unified View</span><strong>${rows.length} rows</strong></div><div class="health-item"><span class="meta">Published metadata</span><strong>${publishedMetadataComplete(rows) ? "Complete" : "Check"}</strong></div><div class="health-item"><span class="meta">Dashboard source</span><strong>v2 only</strong></div><div class="health-item"><span class="meta">Lifecycle writes</span><strong>Single Writer</strong></div></div><p class="health-detail">${escapeHtml(lastLoadError ? lastLoadError.message : `view=${viewEndpoint} · generated_at=${view?.generated_at || "—"} · lifecycle=${lifecycleEndpoint}`)}</p></div></details>`;
    }

    function renderActions(row, status) {
      if (status === "pending_review") return `${actionButton(row, "approve", "审核通过")}${actionButton(row, "archive", "归档", "secondary")}`;
      if (status === "approved") return row.content?.latest_publish_draft ? actionButton(row, "ready_to_publish", "Ready to Publish") : '<span class="pill amber">先保存 Publish Draft</span>';
      if (status === "ready_to_publish") return row.content?.latest_publish_draft ? actionButton(row, "mark_published", "记录已发布") : '<span class="pill red">缺少 Publish Draft</span>';
      if (row.performance_status === "action_required") return '<span class="pill red">Performance attention</span>';
      return "";
    }

    function actionButton(row, action, label, className = "") {
      return `<button type="button" class="${className}" data-lifecycle-action="${action}" data-opportunity-id="${escapeHtml(row.opportunity_id)}">${label}</button>`;
    }

    async function applyLifecycle(button) {
      const action = button.dataset.lifecycleAction;
      const feedback = button.closest("[data-card], .queue-row")?.querySelector(".action-feedback");
      button.dataset.idempotencyKey ||= `${state.actor}:${button.dataset.opportunityId}:${action}:${Date.now()}`;
      const payload = { opportunity_id: button.dataset.opportunityId, action, actor: state.actor, idempotency_key: button.dataset.idempotencyKey };
      if (action === "mark_published") {
        payload.platform = window.prompt("平台：", "linkedin");
        payload.published_url = window.prompt("公开发布链接：", "");
        payload.published_at = new Date().toISOString();
        const editor = button.closest("[data-card], .queue-row")?.querySelector("[data-publish-content]");
        payload.published_content = editor?.value?.trim() || "";
        if (!payload.platform || !payload.published_url || !payload.published_content) {
          if (feedback) feedback.textContent = "发布记录未写入：正文、platform 和 published_url 均为必填。";
          return;
        }
      }
      button.disabled = true;
      try {
        const response = await fetch(lifecycleEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "X-Growth-OS-CSRF": state.csrfToken, "X-Request-Id": makeRequestId() }, body: JSON.stringify(payload) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Lifecycle action failed");
        if (result.view) {
          view = result.view;
          render({ preserveViewport: true });
        } else {
          await load({ preserveViewport: true });
        }
      } catch (error) {
        button.disabled = false;
        if (feedback) feedback.textContent = error.message;
      }
    }

    function makeRequestId() {
      return window.crypto?.randomUUID ? window.crypto.randomUUID() : `dashboard-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function bindInteractions() {
      app.querySelectorAll("[data-lifecycle-action]").forEach((button) => button.addEventListener("click", () => applyLifecycle(button)));
      app.querySelectorAll("[data-content-save]").forEach((button) => button.addEventListener("click", () => saveContent(button)));
      app.querySelectorAll("[data-content-copy]").forEach((button) => button.addEventListener("click", () => copyContent(button)));
      app.querySelectorAll("[data-content-create]").forEach((button) => button.addEventListener("click", () => {
        const section = button.closest(".work-item-section");
        const shell = section?.querySelector("[data-content-create-shell]");
        if (!shell) return;
        button.hidden = true;
        shell.hidden = false;
        shell.querySelector("textarea")?.focus();
      }));
      app.querySelectorAll("[data-details-toggle]").forEach((button) => button.addEventListener("click", () => {
        const detail = document.getElementById(button.dataset.detailsToggle);
        const expanded = button.getAttribute("aria-expanded") === "true";
        detail.hidden = expanded;
        button.setAttribute("aria-expanded", String(!expanded));
        button.textContent = expanded ? "展开详情" : "收起详情";
      }));
      app.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => { state.categoryFilter = button.dataset.filter; state.queueVisible = QUEUE_PAGE_SIZE; render({ preserveViewport: true }); }));
      app.querySelectorAll("[data-hide-filter]").forEach((input) => input.addEventListener("change", () => {
        const stateKey = { help: "hideHelpCenter", policy: "hidePolicy", announcement: "hideAnnouncement" }[input.dataset.hideFilter];
        if (stateKey) state[stateKey] = input.checked;
        state.queueVisible = QUEUE_PAGE_SIZE;
        render({ preserveViewport: true });
      }));
      app.querySelectorAll("[data-sort]").forEach((input) => input.addEventListener("change", () => { state.sort = input.value; render({ preserveViewport: true }); }));
      app.querySelectorAll("[data-load-more]").forEach((button) => button.addEventListener("click", () => { state.queueVisible += QUEUE_PAGE_SIZE; render({ preserveViewport: true }); }));
      app.querySelectorAll("[data-load-published-more]").forEach((button) => button.addEventListener("click", () => { state.publishedVisible += 20; render({ preserveViewport: true }); }));
    }

    async function saveContent(button) {
      const root = button.closest("[data-card], .queue-row");
      const editor = root?.querySelector(`[data-content-editor][data-content-type="${button.dataset.contentType}"]`);
      const feedback = button.closest(".work-item-section")?.querySelector(".content-feedback");
      const contentText = editor?.value?.trim() || "";
      if (!contentText) { if (feedback) feedback.textContent = "内容不能为空。"; return; }
      button.disabled = true;
      const payload = { opportunity_id: button.dataset.opportunityId, content_type: button.dataset.contentType, content_text: contentText, actor: state.actor, idempotency_key: `${state.actor}:${button.dataset.opportunityId}:${button.dataset.contentType}:${Date.now()}` };
      try {
        const response = await fetch(contentEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "X-Growth-OS-CSRF": state.csrfToken, "X-Request-Id": makeRequestId() }, body: JSON.stringify(payload) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Content save failed");
        view = result.view;
        render({ preserveViewport: true });
      } catch (error) {
        button.disabled = false;
        if (feedback) feedback.textContent = error.message;
      }
    }

    async function copyContent(button) {
      const root = button.closest("[data-card], .queue-row");
      const editor = root?.querySelector(`[data-content-editor][data-content-type="${button.dataset.contentType}"]`);
      const feedback = button.closest(".work-item-section")?.querySelector(".content-feedback");
      const text = editor?.value?.trim() || "";
      if (!text) { if (feedback) feedback.textContent = "没有可复制的内容。"; return; }
      try {
        await navigator.clipboard.writeText(text);
        if (feedback) feedback.textContent = "已复制。";
      } catch {
        if (feedback) feedback.textContent = "复制失败，请手动选择文本。";
      }
    }

    function classifyRow(row) {
      const original = row.content?.original_content?.content_text || "";
      const text = `${row.title || ""} ${original} ${row.source_url || ""}`.toLowerCase();
      const tags = [];
      if (/(help\.|help center|\/hc\/|policies?)/.test(text)) tags.push("Help Center");
      if (/polic(y|ies)/.test(text)) tags.push("Policy");
      if (/announc/.test(text)) tags.push("Announcement");
      if (/(buyer|buying|order|payment|quote|quotation|sample|deposit)/.test(text)) tags.push("Buyer Question");
      if (/(supplier|factory|vendor|moq|production|manufactur)/.test(text)) tags.push("Supplier Question");
      const score = scoreValue(row);
      if (score !== 0 && score < 50) tags.push("Low Relevance");
      return tags;
    }

    function tagBadge(tag) {
      const tone = tag === "Low Relevance" ? "red" : tag === "Help Center" || tag === "Policy" || tag === "Announcement" ? "gray" : "";
      return `<span class="tag ${tone}">${escapeHtml(tag)}</span>`;
    }

    function sourceLink(row) {
      if (!row.source_url) return '<span class="meta">—</span>';
      const label = sourceLabel(row.source_url);
      return `<a href="${escapeHtml(row.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    }

    function sourceLabel(value) {
      if (String(value).startsWith("/")) return value;
      try { return new URL(value, window.location.origin).hostname.replace(/^www\./, "") || value; } catch { return value; }
    }

    function platformLabel(row) { return row.platform || "Unassigned"; }

    function scoreValue(row) {
      const value = row.score ?? row.relevance_score ?? row.quality_score;
      return Number.isFinite(Number(value)) ? Number(value) : 0;
    }

    function formatScore(row) {
      const value = row.score ?? row.relevance_score ?? row.quality_score;
      return Number.isFinite(Number(value)) ? String(value) : "—";
    }

    function formatAge(row) {
      const time = Date.parse(row.status_changed_at || row.updated_at || row.created_at || "");
      if (!Number.isFinite(time)) return "—";
      const minutes = Math.max(0, Math.floor((Date.now() - time) / 60000));
      if (minutes < 60) return `${minutes}m`;
      if (minutes < 1440) return `${Math.floor(minutes / 60)}h`;
      if (minutes < 43200) return `${Math.floor(minutes / 1440)}d`;
      return `${Math.floor(minutes / 43200)}mo`;
    }

    function ageValue(row) { return Date.parse(row.status_changed_at || row.updated_at || row.created_at || "") || 0; }

    function statusLabel(status) {
      return ({ pending_review: "待审核", approved: "已审核", ready_to_publish: "待发布", published: "已发布", archived: "已归档" })[status] || status || "未知";
    }

    function statusTone(status) {
      return ({ pending_review: "amber", approved: "", ready_to_publish: "green", published: "green", archived: "gray" })[status] || "";
    }

    function performanceTone(status) { return status === "action_required" ? "red" : status === "confirmed" ? "green" : "gray"; }

    function publishedMetadataComplete(rows) {
      return rows.filter((row) => row.current_status === "published").every((row) => row.published_at && row.platform && row.published_url);
    }

    function nextSchedulerRun() {
      const now = new Date();
      const candidates = [8, 14].map((hour) => { const date = new Date(now); date.setHours(hour, 0, 0, 0); if (date <= now) date.setDate(date.getDate() + 1); return date; });
      return formatDate(candidates.sort((a, b) => a - b)[0].toISOString());
    }

    function formatDate(value) {
      const time = Date.parse(value || "");
      return Number.isFinite(time) ? new Date(time).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }

    function setServerStatus(online) {
      document.getElementById("serverDot").classList.toggle("offline", !online);
      document.getElementById("serverStatus").textContent = online ? "Growth OS v2 online" : "v2 server unavailable";
    }
  </script>
</body>
</html>
