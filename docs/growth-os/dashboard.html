<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth OS 增长运营中心</title>
  <style>
    :root {
      --ink: #152033;
      --muted: #65758b;
      --line: #dce5ef;
      --bg: #f6f8fb;
      --panel: #fff;
      --blue: #2563eb;
      --green: #0f766e;
      --amber: #b45309;
      --red: #b91c1c;
      --shadow: 0 18px 50px rgba(21, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }
    header {
      align-items: flex-end;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 0 14px;
    }
    .workspace-nav, .workflow-actions, .header-actions, .report-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .workspace-nav button {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 8px 11px;
    }
    .workspace-nav button.active { background: var(--ink); color: #fff; }
    .header-actions { align-items: center; justify-content: flex-end; }
    .header-actions button, .report-nav button, button.text-button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 7px 8px;
    }
    .report-nav button.active { background: #eef2ff; color: var(--blue); }
    .server-dot { background: var(--green); border-radius: 50%; display: inline-block; height: 8px; width: 8px; }
    .server-dot.offline { background: var(--red); }
    .workspace-view[hidden] { display: none; }
    .workflow-actions { margin-top: 12px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.05; }
    h2 { font-size: 19px; margin-bottom: 12px; }
    h3 { font-size: 15px; }
    a { color: var(--blue); overflow-wrap: anywhere; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, .button {
      background: var(--ink);
      border: 0;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: inline-block;
      font-weight: 750;
      padding: 10px 14px;
      text-decoration: none;
    }
    button.secondary, .button.secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    button.approve { background: var(--green); }
    button.reject { background: var(--red); }
    button.revision { background: var(--amber); }
    button.quiet { background: transparent; color: var(--muted); padding-inline: 6px; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      padding: 9px 10px;
      width: 100%;
    }
    textarea { min-height: 76px; resize: vertical; }
    label span {
      color: var(--muted);
      display: block;
      font-size: 12px;
      font-weight: 750;
      margin-bottom: 4px;
    }
    main {
      display: grid;
      gap: 18px;
      padding: 10px 0 46px;
    }
    .meta { color: var(--muted); }
    .panel, .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
    }
    .hero {
      box-shadow: var(--shadow);
      display: grid;
      gap: 20px;
      grid-template-columns: 1.35fr .65fr;
      padding: clamp(20px, 3vw, 32px);
    }
    .hero > *, .card, .decision-item { min-width: 0; }
    .label {
      color: var(--amber);
      font-weight: 850;
      margin-bottom: 8px;
    }
    .kicker {
      align-items: center;
      display: flex;
      gap: 8px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .action-title {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.04;
      margin: 4px 0 14px;
    }
    .toolbar {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto;
    }
    .section-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .decision-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 16px 0;
    }
    .decision-item {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .next-action {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      color: #7c2d12;
      margin-top: 14px;
      padding: 14px;
    }
    .next-action strong {
      display: block;
      font-size: 18px;
      line-height: 1.3;
      margin-top: 4px;
    }
    .signal-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .signal-value {
      display: block;
      font-size: 22px;
      font-weight: 900;
      margin-top: 4px;
    }
    .platform-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .discovery-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .comment-preview {
      background: #f8fafc;
      border-left: 3px solid var(--blue);
      color: var(--ink);
      margin: 10px 0;
      padding: 10px 12px;
    }
    .comment-preview, .next-action strong { overflow-wrap: anywhere; }
    .candidate-facts { display: grid; gap: 7px; margin: 10px 0; }
    .candidate-facts p { overflow-wrap: anywhere; }
    .platform-risk { background: #fff7ed; border: 1px solid #fed7aa; }
    .platform-card .meta {
      margin-top: 4px;
    }
    .action-row {
      align-items: flex-start;
      display: grid;
      gap: 10px;
      grid-template-columns: auto 1fr auto;
    }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }
    .head {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .pill {
      border-radius: 999px;
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .high { background: #ecfdf5; color: var(--green); }
    .neutral { background: #eef2ff; color: var(--blue); }
    .warn { background: #fef3c7; color: var(--amber); }
    .bad { background: #fef2f2; color: var(--red); }
    .scores {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, 1fr);
      margin: 14px 0;
    }
    .score {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px;
    }
    .score b {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-top: 4px;
    }
    .tasks, .list { display: grid; gap: 9px; }
    .task {
      align-items: flex-start;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      gap: 10px;
      padding: 11px;
    }
    .box {
      border: 2px solid #94a3b8;
      border-radius: 4px;
      flex: 0 0 auto;
      height: 18px;
      margin-top: 1px;
      width: 18px;
    }
    .reasons {
      display: grid;
      gap: 8px;
      list-style: none;
      margin: 14px 0 18px;
      padding: 0;
    }
    .reasons li::before {
      color: var(--green);
      content: "✓";
      font-weight: 900;
      margin-right: 8px;
    }
    .flow {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .step {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
    }
    .arrow { color: var(--muted); }
    .chain {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .asset {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
    }
    .progress {
      background: #e2e8f0;
      border-radius: 999px;
      height: 10px;
      margin: 12px 0;
      overflow: hidden;
    }
    .progress span {
      background: var(--blue);
      display: block;
      height: 100%;
    }
    .checklist {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }
    details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-top: 10px;
      padding: 12px;
    }
    summary { cursor: pointer; font-weight: 850; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .filters button {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 8px 11px;
    }
    .filters button.active {
      background: var(--ink);
      color: #fff;
    }
    .timeline {
      border-left: 2px solid var(--line);
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-left: 12px;
    }
    .form-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .form-grid .wide { grid-column: 1 / -1; }
    .review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      color: var(--red);
      padding: 14px;
    }
    @media (max-width: 860px) {
      header, .hero, .grid, .cards, .form-grid, .toolbar, .decision-grid, .signal-grid, .platform-grid, .discovery-grid, .action-row { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { justify-content: flex-start; }
      .scores { grid-template-columns: 1fr; }
      .form-grid .wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Growth OS 增长运营中心</h1>
      <p class="meta" id="generatedAt">读取本地数据中...</p>
    </div>
    <div>
      <nav class="workspace-nav" id="workspaceNav" aria-label="Growth OS 工作区"></nav>
      <div class="header-actions"><span class="meta" id="serverStatus"><span class="server-dot"></span> Local server</span><button type="button" id="reloadData">刷新工作台</button></div>
    </div>
  </header>

  <main id="app">
    <section class="panel">加载中...</section>
  </main>

  <script>
    const viewUrl = "http://127.0.0.1:8787/data/growth-os/viewer/dashboard-view.json";
    const publishUrl = "http://127.0.0.1:8787/__publishing-links";
    const signalUrl = "http://127.0.0.1:8787/__buyer-signal";
    const reviewActionUrl = "http://127.0.0.1:8787/__review-action";
    const discoveryActionUrl = "http://127.0.0.1:8787/__discovery-action";
    const manualDiscoveryUrl = "http://127.0.0.1:8787/__manual-discovery";
    const app = document.getElementById("app");
    const generatedAt = document.getElementById("generatedAt");
    let state = null;
    let statusFilter = "all";
    let platformFilter = "all";
    let inboxFilter = "priority";
    let inboxShowAll = false;
    let reportsPage = "overview";
    let workspacePage = workspacePageFromHash();

    main();

    async function main() {
      try {
        state = await fetchJson(viewUrl);
        generatedAt.textContent = `Last updated：${formatDate(state.generated_at)}`;
        setServerStatus(true);
        render();
      } catch (error) {
        setServerStatus(false);
        app.innerHTML = `<section class="error">Local Growth OS server is not available. Changes cannot be saved.</section>`;
      }
    }

    async function fetchJson(url) {
      const response = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`${url} ${response.status}`);
      return response.json();
    }

    function render() {
      document.getElementById("workspaceNav").innerHTML = renderWorkspaceNav();
      app.innerHTML = `
        <section class="workspace-view" ${workspacePage === "today" ? "" : "hidden"}>${renderTodayWorkspace()}</section>
        <section class="workspace-view" ${workspacePage === "inbox" ? "" : "hidden"}>${renderInboxWorkspace()}</section>
        <section class="workspace-view" ${workspacePage === "results" ? "" : "hidden"}>${renderResultsWorkspace()}</section>
        <section class="workspace-view" ${workspacePage === "reports" ? "" : "hidden"}>${renderReportsWorkspace()}</section>
      `;
      applyFilters();
      applySearch();
    }

    function workspacePageFromHash() {
      const page = window.location.hash.replace(/^#/, "").toLowerCase();
      return ["inbox", "today", "results", "reports"].includes(page) ? page : "today";
    }

    function renderWorkspaceNav() {
      const labels = { inbox: "Inbox", today: "Today", results: "Results", reports: "Reports" };
      return Object.entries(labels).map(([page, label]) => `<button type="button" data-workspace-page="${page}" class="${workspacePage === page ? "active" : ""}">${label}</button>`).join("");
    }

    function renderSearch() {
      return `
        <section class="panel toolbar">
          <div>
            <h2>今天先看什么</h2>
            <p class="meta">搜索 GO ID、标题、买家问题、平台或状态。</p>
          </div>
          <input id="globalSearch" type="search" placeholder="搜索：GO-002 / LinkedIn / 待审核 / supplier trust">
        </section>
      `;
    }

    function renderHero(action, tasks) {
      const decision = state.decision_summary || {};
      if (!action) return `<section class="hero"><div><p class="label">今日重点</p><h2>暂无优先行动</h2></div></section>`;
      return `
        <section class="hero">
          <div>
            <p class="section-label">Layer 1 · Decision</p>
            <p class="kicker"><span>🔥</span><span>今日重点</span></p>
            <h2 class="action-title">${escapeHtml(action.id)}<br>${escapeHtml(action.title)}</h2>
            <p>状态：<span class="pill ${statusClass(action.status_key)}">${escapeHtml(action.status)}</span></p>
            <div class="decision-grid">
              ${decisionItem("当前阶段", decision.current_stage)}
              ${decisionItem("主要信号", decision.main_signal)}
              ${decisionItem("主要风险", decision.main_risk)}
            </div>
            <div class="next-action">
              <span class="section-label">下一步最佳动作</span>
              <strong>${escapeHtml(decision.next_best_action || action.next_step)}</strong>
            </div>
            <div class="scores">
              ${scoreBox("SEO", action.scores.seo)}
              ${scoreBox("GEO", action.scores.geo)}
              ${scoreBox("商业", action.scores.business)}
            </div>
            <p style="margin-top:14px;">
              <a class="button" href="${action.review_url}${["approved", "publish_ready"].includes(action.status_key) ? "?mode=publish" : ""}" target="_blank" rel="noopener">${escapeHtml(actionButtonLabel(action.status_key))}</a>
              <a class="button secondary" href="#assets">查看生成资产</a>
              <a class="button secondary" href="#today-opportunities">查看今日机会</a>
            </p>
          </div>
          <aside>
            <h2>今日动作</h2>
            <div class="tasks">${(state.today_actions || []).slice(0, 3).map(renderTodayAction).join("") || tasks.slice(0, 3).map((task) => `<div class="task"><span class="box"></span><span>${escapeHtml(task)}</span></div>`).join("")}</div>
          </aside>
        </section>
      `;
    }

    function decisionItem(label, value) {
      return `<div class="decision-item"><p class="meta">${escapeHtml(label)}</p><strong>${escapeHtml(value || "Not tracked")}</strong></div>`;
    }

    function renderTodayAction(item) {
      return `
        <div class="task action-row">
          <span class="box"></span>
          <span>
            <strong>${escapeHtml(item.platform)} · ${escapeHtml(item.action)}</strong>
            <span class="meta" style="display:block;">原因：${escapeHtml(item.reason)}</span>
          </span>
          <span class="pill ${item.priority === "High" ? "warn" : "neutral"}">${escapeHtml(item.priority)}</span>
        </div>
      `;
    }

    function workspaceData() {
      return state.workspace || {
        inbox: state.opportunity_inbox || state.today_opportunities || [],
        today: state.today_execution || [],
        results: state.results || []
      };
    }

    function renderTodayWorkspace() {
      const workspace = workspaceData();
      const items = workspace.today || [];
      const completedToday = (workspace.results || []).filter((item) => String(item.last_action_at || "").slice(0, 10) === new Date().toISOString().slice(0, 10)).length;
      const remaining = Math.max(0, 3 - items.length);
      return `
        <section class="hero">
          <div>
            <p class="section-label">Today · 默认工作区</p>
            <p class="kicker">只完成已经人工选择的任务</p>
            <h2 class="action-title">${items.length ? `${items.length} 条待执行` : "今天尚未选任务"}</h2>
            <div class="next-action"><span class="section-label">当前先做</span><strong>${items[0] ? `${escapeHtml(items[0].platform)} / ${escapeHtml(items[0].topic)}` : "先在 Inbox 审核一个真实候选。"}</strong></div>
          </div>
          <aside><p class="meta">今日上限：3 条</p><p class="meta">当前完成：${completedToday} 条</p><p class="meta">剩余名额：${remaining} 条</p><p class="meta">候选不会自动进入 Today</p></aside>
        </section>
        <section class="panel">
          <div class="head"><div><h2>今天执行</h2><p class="meta">依次查看、准备草稿、手动发布、粘贴真实回复 URL。</p></div><span class="pill neutral">${items.length} / 3</span></div>
          <div class="cards">${items.length ? items.map((item) => renderWorkspaceCandidate(item, "today")).join("") : `<div><p class="meta">暂无已选任务。请到 Inbox 选择候选。</p><button type="button" data-workspace-page="inbox" style="margin-top:12px;">去 Inbox 选择任务</button></div>`}</div>
        </section>
      `;
    }

    function renderInboxWorkspace() {
      const items = workspaceData().inbox || [];
      const visibleItems = inboxVisibleItems(items);
      const counts = inboxCounts(items);
      return `
        <section class="panel">
          <div class="head"><div><p class="section-label">Inbox · 待审核机会</p><h2>Opportunity Inbox</h2><p class="meta">只有人工确认仍可回复、主题匹配且风险可接受的候选，才能加入 Today。</p></div><span class="pill neutral">${items.length} 条</span></div>
          <div class="signal-grid"><div class="card"><span class="meta">待审核总数</span><strong class="signal-value">${counts.total}</strong></div><div class="card"><span class="meta">High Intent Buyer</span><strong class="signal-value">${counts.highBuyer}</strong></div><div class="card"><span class="meta">Medium Intent</span><strong class="signal-value">${counts.medium}</strong></div><div class="card"><span class="meta">Aging / Later</span><strong class="signal-value">${counts.agingLater}</strong></div></div>
          ${renderManualDiscoveryForm()}
          ${renderInboxPlatformRisk()}
          <div class="filters">${["priority", "all", "high", "buyer", "partner", "fresh", "recent", "later"].map((filter) => `<button type="button" data-inbox-filter="${filter}" class="${inboxFilter === filter ? "active" : ""}">${inboxFilterLabel(filter)}</button>`).join("")}</div>
          <div class="cards">${visibleItems.length ? visibleItems.map((item) => renderWorkspaceCandidate(item, "inbox")).join("") : `<p class="meta">当前筛选下没有候选。</p>`}</div>
          ${!inboxShowAll && visibleItems.length < items.length ? `<button type="button" class="secondary" data-inbox-show-all style="margin-top:12px;">查看全部 ${items.length} 条</button>` : ""}
        </section>
      `;
    }

    function renderResultsWorkspace() {
      const items = workspaceData().results || [];
      return `
        <section class="panel">
          <div class="head"><div><p class="section-label">Results · 结果跟踪</p><h2>已发布回复</h2><p class="meta">真实回复 URL 和后续结果只在这里记录。</p></div><span class="pill neutral">${items.length} 条</span></div>
          <div class="cards">${items.length ? items.map((item) => renderWorkspaceCandidate(item, "results")).join("") : `<div><p class="meta">尚无已发布回复。</p><button type="button" data-workspace-page="today" style="margin-top:12px;">查看 Today</button></div>`}</div>
        </section>
      `;
    }

    function renderWorkspaceCandidate(item, mode) {
      const stateLabel = item.workflow_state_label || item.workflow_state || "待审核";
      const header = `<div class="head"><h3>${escapeHtml(item.platform)} · ${escapeHtml(item.topic)}</h3><span class="pill neutral">${escapeHtml(stateLabel)}</span></div>`;
      const detail = `<div class="candidate-facts"><p class="meta">Opportunity Quality：${escapeHtml(item.opportunity_quality || item.intent_score || "Not recorded")} · Intent：${escapeHtml(item.intent_score || "Not recorded")} · Expected Value：${escapeHtml(item.expected_value || "Not recorded")}</p><p class="meta">Freshness：${escapeHtml(item.freshness_status || "Not recorded")} · 作者：${escapeHtml(item.author || "Not recorded")} · 来源：${escapeHtml(item.source_label || discoverySourceLabel(item.source_method))}</p><p><strong>为什么值得回复：</strong>${escapeHtml(item.why_relevant || "Needs manual review")}</p><p><strong>建议回复角度：</strong>${escapeHtml(item.suggested_angle || "先阅读原帖，再人工判断。")}</p>${item.opportunity_risk_status && item.opportunity_risk_status !== "Low" ? `<p class="meta"><strong>Opportunity Risk：${escapeHtml(item.opportunity_risk_status)}</strong> · ${escapeHtml(item.opportunity_risk_note || "需要人工确认")}</p>` : ""}<p class="meta">Manual Review Required：${item.needs_manual_review === false ? "No" : "Yes"}</p></div>`;
      const source = `<a class="button secondary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">打开原帖</a>`;
      let actions = "";
      if (mode === "inbox") actions = `<button type="button" class="approve" data-discovery-action="select_today" data-id="${escapeHtml(item.id)}">加入 Today</button>${source}${item.workflow_state === "later" ? "" : `<button type="button" class="text-button" data-discovery-action="later" data-id="${escapeHtml(item.id)}">稍后</button>`}<button type="button" class="quiet" data-discovery-action="ignore" data-confirm-ignore data-id="${escapeHtml(item.id)}">忽略</button>`;
      if (mode === "today") {
        if (item.workflow_state === "today") actions = `${source}<button type="button" class="secondary" data-discovery-copy="${escapeHtml(item.id)}" ${item.suggested_comment ? "" : "disabled"}>复制建议回复</button><button type="button" class="approve" data-discovery-action="viewed" data-id="${escapeHtml(item.id)}">已查看</button>`;
        if (item.workflow_state === "viewed") actions = `${source}<button type="button" class="secondary" data-discovery-copy="${escapeHtml(item.id)}" ${item.suggested_comment ? "" : "disabled"}>复制建议回复</button><button type="button" class="approve" data-discovery-action="draft_prepared" data-id="${escapeHtml(item.id)}">草稿已准备</button>`;
        if (item.workflow_state === "draft_prepared") actions = `${source}<label style="flex:1;min-width:220px;"><span>实际回复 URL</span><input type="url" data-reply-url placeholder="https://..."></label><button type="button" class="approve" data-discovery-action="replied" data-id="${escapeHtml(item.id)}">标记已发布回复</button>`;
      }
      if (mode === "results") {
        const outcomes = item.workflow_state === "outcome_pending" ? `<button type="button" class="revision" data-discovery-action="removed" data-id="${escapeHtml(item.id)}">被删除</button><button type="button" class="secondary" data-discovery-action="received_reply" data-id="${escapeHtml(item.id)}">收到回复</button><button type="button" class="approve" data-discovery-action="buyer_signal" data-id="${escapeHtml(item.id)}">买家信号</button><button type="button" class="approve" data-discovery-action="partner_signal" data-id="${escapeHtml(item.id)}">合作信号</button><button type="button" class="secondary" data-discovery-action="review_request" data-id="${escapeHtml(item.id)}">审核请求</button><button type="button" class="approve" data-discovery-action="paid_opportunity" data-id="${escapeHtml(item.id)}">付费机会</button><button type="button" class="secondary" data-discovery-action="no_response" data-id="${escapeHtml(item.id)}">无回复</button>` : item.workflow_state === "received_reply" ? `<button type="button" class="approve" data-discovery-action="buyer_signal" data-id="${escapeHtml(item.id)}">买家信号</button><button type="button" class="approve" data-discovery-action="partner_signal" data-id="${escapeHtml(item.id)}">合作信号</button><button type="button" class="secondary" data-discovery-action="review_request" data-id="${escapeHtml(item.id)}">审核请求</button><button type="button" class="approve" data-discovery-action="paid_opportunity" data-id="${escapeHtml(item.id)}">付费机会</button><button type="button" class="secondary" data-discovery-action="closed" data-id="${escapeHtml(item.id)}">关闭</button>` : ["buyer_signal", "partner_signal", "review_request", "paid_opportunity"].includes(item.workflow_state) ? `<button type="button" class="secondary" data-discovery-action="closed" data-id="${escapeHtml(item.id)}">关闭</button>` : `<span class="meta">结果已记录。</span>`;
        actions = `${source}${outcomes}`;
      }
      return `<article class="card searchable" data-discovery-card data-search="${searchText(item)}">${header}${detail}${mode === "today" ? `<div class="comment-preview"><strong>建议回复</strong><br>${escapeHtml(item.suggested_comment || "请先阅读原帖。")}</div>` : ""}${mode === "results" ? `<p>回复链接：${item.reply_url ? `<a href="${escapeHtml(item.reply_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.reply_url)}</a>` : "未记录"}</p><p class="meta">回复链接验证：${escapeHtml(item.reply_url_verification || "未记录")}</p>` : ""}<div class="workflow-actions">${actions}</div><p class="meta" data-discovery-status></p></article>`;

    function inboxVisibleItems(items) {
      if (inboxFilter === "priority") {
        const priority = items.filter((item) => item.expected_value === "Buyer" && item.intent_score === "High" && ["Fresh", "Recent"].includes(item.freshness_status));
        const fallback = items.filter((item) => !priority.includes(item) && item.workflow_state !== "later");
        return [...priority, ...fallback].slice(0, 8);
      }
      const filtered = items.filter((item) => {
        if (inboxFilter === "high") return item.intent_score === "High";
        if (inboxFilter === "buyer") return item.expected_value === "Buyer";
        if (inboxFilter === "partner") return item.expected_value === "Partner";
        if (inboxFilter === "fresh") return item.freshness_status === "Fresh";
        if (inboxFilter === "recent") return item.freshness_status === "Recent";
        if (inboxFilter === "later") return item.workflow_state === "later";
        return true;
      });
      return inboxShowAll ? filtered : filtered.slice(0, 8);
    }

    function inboxCounts(items) {
      return {
        total: items.length,
        highBuyer: items.filter((item) => item.expected_value === "Buyer" && item.intent_score === "High").length,
        medium: items.filter((item) => item.intent_score === "Medium").length,
        agingLater: items.filter((item) => ["Aging", "Archive"].includes(item.freshness_status) || item.workflow_state === "later").length
      };
    }

    function inboxFilterLabel(filter) {
      return { priority: "Priority", all: "All", high: "High Intent", buyer: "Buyer", partner: "Partner", fresh: "Fresh", recent: "Recent", later: "Later" }[filter];

            <h3>最近发现</h3>
            <p>${escapeHtml(learning.recent_pattern)}</p>
            <p class="meta" style="margin-top:8px;">依据：${escapeHtml((learning.evidence || []).join(" · "))}</p>
          </div>
          <div class="card" style="margin-top:10px;">
            <h3>建议</h3>
            <p>${escapeHtml(learning.recommendation)}</p>
          </div>
        </section>
      `;
    }

    function renderArchived(items) {
      return `
        <section class="panel">
          <h2>Archived / 停止原因</h2>
          <div class="cards">${items.length ? items.map((item) => `
            <article class="card">
              <h3>${escapeHtml(item.id)} · ${escapeHtml(item.title)}</h3>
              <ul>${item.reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>
            </article>
          `).join("") : `<p class="meta">暂无归档项。</p>`}</div>
        </section>
      `;
    }

    function renderInputs(options) {
      return `
        <section class="grid">
          <section class="panel">
            <h2>添加客户信号</h2>
            <form class="form-grid" data-signal-form>
              <label><span>来源</span><input name="source" placeholder="Reddit / 客户对话 / LinkedIn"></label>
              <label><span>阶段</span><select name="stage">${options.stages.map((stage) => `<option>${escapeHtml(stage)}</option>`).join("")}</select></label>
              <label class="wide"><span>问题</span><textarea name="question" placeholder="买家真实问题"></textarea></label>
              <label><span>痛点</span><input name="pain" placeholder="trust / deposit / quote"></label>
              <label><span>关联 GO</span><input name="related_go" placeholder="GO-002"></label>
              <p class="wide"><button type="submit">保存客户信号</button></p>
              <p class="meta wide" id="signalStatus">保存到 buyer-signals.jsonl</p>
            </form>
          </section>
          <section class="panel">
            <h2>添加发布结果</h2>
            <form class="form-grid" data-publish-form>
              <label><span>GO ID</span><input name="content_id" placeholder="GO-002"></label>
              <label><span>平台</span><select name="platform">${options.platforms.map((platform) => `<option>${escapeHtml(platform)}</option>`).join("")}</select></label>
              <label class="wide"><span>URL</span><input name="url" placeholder="https://..."></label>
              <label><span>浏览</span><input name="views" type="number" min="0" value="0"></label>
              <label><span>点击</span><input name="clicks" type="number" min="0" value="0"></label>
              <label><span>询盘</span><input name="leads" type="number" min="0" value="0"></label>
              <p class="wide"><button type="submit">保存发布结果</button></p>
              <p class="meta wide" id="publishStatus">保存到 published-content / social-metrics</p>
            </form>
          </section>
        </section>
      `;
    }

    function scoreBox(label, value) {
      return `<div class="score"><span class="meta">${label}</span><b>${Number(value) || 0}</b></div>`;
    }

    function statusClass(status) {
      if (["published", "monitoring", "learning"].includes(status)) return "high";
      if (["review_pending", "approved", "publish_ready"].includes(status)) return "warn";
      if (["rejected", "revision_required"].includes(status)) return "bad";
      return "neutral";
    }

    function riskClass(status) {
      if (status === "High") return "bad";
      if (status === "Medium") return "warn";
      return "high";
    }

    function actionButtonLabel(status) {
      if (status === "review_pending") return "进入审核工作台";
      if (["approved", "publish_ready"].includes(status)) return "打开发布内容";
      if (["published", "monitoring", "learning"].includes(status)) return "查看内容";
      if (status === "revision_required") return "查看修改要求";
      return "查看内容包";
    }

    function renderCompletion(completion) {
      if (!completion) return "";
      return `
        <div class="progress" aria-label="内容完成度 ${completion.progress}%"><span style="width:${completion.progress}%"></span></div>
        <p class="meta">内容完成度：${completion.progress}%</p>
        <div class="checklist">
          <p>已完成：${completion.completed.map((item) => `✓ ${escapeHtml(item)}`).join(" · ")}</p>
          <p class="meta">缺少：${completion.missing.map((item) => `⬜ ${escapeHtml(item)}`).join(" · ") || "无"}</p>
        </div>
      `;
    }

    function searchText(item) {
      return escapeHtml(Object.values(item || {}).flatMap((value) => Array.isArray(value) ? value : [value]).join(" ").toLowerCase());
    }

    function filterButton(type, value, label) {
      const active = type === "status" ? statusFilter === value : platformFilter === value;
      return `<button type="button" data-filter-type="${type}" data-filter-value="${value}" class="${active ? "active" : ""}">${label}</button>`;
    }

    document.addEventListener("click", (event) => {
      const workspaceButton = event.target.closest("[data-workspace-page]");
      if (workspaceButton) {
        window.location.hash = workspaceButton.dataset.workspacePage;
        return;
      }
      const reviewButton = event.target.closest("[data-review-action]");
      if (reviewButton) {
        saveReviewAction(reviewButton);
        return;
      }
      const discoveryButton = event.target.closest("[data-discovery-action]");
      if (discoveryButton) {
        if (discoveryButton.hasAttribute("data-confirm-ignore") && !window.confirm("确认忽略这条候选？")) return;
        saveDiscoveryAction(discoveryButton);
        return;
      }
      const inboxFilterButton = event.target.closest("[data-inbox-filter]");
      if (inboxFilterButton) {
        inboxFilter = inboxFilterButton.dataset.inboxFilter;
        inboxShowAll = inboxFilter === "all";
        render();
        return;
      }
      if (event.target.closest("[data-inbox-show-all]")) {
        inboxShowAll = true;
        inboxFilter = "all";
        render();
        return;
      }
      const reportsButton = event.target.closest("[data-reports-page]");
      if (reportsButton) {
        reportsPage = reportsButton.dataset.reportsPage;
        render();
        return;
      }
      const copyButton = event.target.closest("[data-discovery-copy]");
      if (copyButton) {
        copyDiscoveryComment(copyButton);
        return;
      }
      const button = event.target.closest("[data-filter-type]");
      if (!button) return;
      if (button.dataset.filterType === "status") statusFilter = button.dataset.filterValue;
      if (button.dataset.filterType === "platform") platformFilter = button.dataset.filterValue;
      applyFilters();
    });

    window.addEventListener("hashchange", () => {
      workspacePage = workspacePageFromHash();
      if (state) render();
    });

    document.getElementById("reloadData").addEventListener("click", main);

    document.addEventListener("input", (event) => {
      if (event.target.id === "globalSearch") applySearch();
    });

    async function saveReviewAction(button) {
      const card = button.closest("[data-review-card]");
      const status = card.querySelector("[data-review-status]");
      await postJson(reviewActionUrl, {
        id: button.dataset.id,
        action: button.dataset.reviewAction,
        note: card.querySelector("[data-review-note]").value
      }, status);
    }

    async function saveDiscoveryAction(button) {
      const card = button.closest("[data-discovery-card]");
      const status = card.querySelector("[data-discovery-status]");
      try {
        const response = await fetch(discoveryActionUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: button.dataset.id,
            action: button.dataset.discoveryAction,
            reply_url: card.querySelector("[data-reply-url]")?.value || ""
          })
        });
        if (!response.ok) throw new Error(await response.text());
        status.textContent = "已记录，正在刷新工作区。";
        await main();
      } catch (error) {
        status.textContent = "Local Growth OS server is not available. Changes cannot be saved.";
      }
    }

    async function copyDiscoveryComment(button) {
      const item = [...(state.opportunity_inbox || []), ...(state.today_execution || []), ...(state.results || [])]
        .find((candidate) => candidate.id === button.dataset.discoveryCopy);
      const card = button.closest("[data-discovery-card]");
      const status = card.querySelector("[data-discovery-status]");
      try {
        await navigator.clipboard.writeText(item?.suggested_comment || "");
        status.textContent = "建议回复已复制。";
      } catch {
        status.textContent = "复制失败，请手动选择建议回复。";
      }
    }

    document.addEventListener("submit", async (event) => {
      const signalForm = event.target.closest("[data-signal-form]");
      const publishForm = event.target.closest("[data-publish-form]");
      const manualDiscoveryForm = event.target.closest("[data-manual-discovery-form]");
      if (!signalForm && !publishForm && !manualDiscoveryForm) return;
      event.preventDefault();
      if (signalForm) await postForm(signalUrl, signalForm, "signalStatus");
      if (manualDiscoveryForm) await saveManualDiscovery(manualDiscoveryForm);
      if (publishForm) {
        const data = Object.fromEntries(new FormData(publishForm));
        await postJson(publishUrl, {
          content_id: data.content_id,
          platform: data.platform,
          status: Number(data.views || 0) || Number(data.clicks || 0) || Number(data.leads || 0) ? "measuring" : "published",
          url: data.url,
          published_date: new Date().toISOString().slice(0, 10),
          metrics: {
            views: Number(data.views) || 0,
            likes: 0,
            comments: 0,
            clicks: Number(data.clicks) || 0,
            leads: Number(data.leads) || 0
          }
        }, "publishStatus");
      }
    });

    async function saveManualDiscovery(form) {
      const status = document.getElementById("manualDiscoveryStatus");
      try {
        const response = await fetch(manualDiscoveryUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();
        status.textContent = result.added ? "已加入候选池，正在刷新看板。" : "该公开链接已在候选池中。";
        window.setTimeout(() => window.location.reload(), 250);
      } catch (error) {
        status.textContent = "Local Growth OS server is not available. Changes cannot be saved.";
      }
    }

    function applyFilters() {
      document.querySelectorAll("[data-filter-type]").forEach((button) => {
        const active = button.dataset.filterType === "status"
          ? button.dataset.filterValue === statusFilter
          : button.dataset.filterValue === platformFilter;
        button.classList.toggle("active", active);
      });
      document.querySelectorAll("[data-lifecycle-card]").forEach((card) => {
        const statusOk = statusFilter === "all" || card.dataset.status === statusFilter;
        const platformOk = platformFilter === "all" || card.dataset.platforms.split(",").includes(platformFilter);
        card.dataset.filterHidden = String(!statusOk || !platformOk);
      });
      applySearch();
    }

    function applySearch() {
      const query = (document.getElementById("globalSearch")?.value || "").trim().toLowerCase();
      document.querySelectorAll(".searchable").forEach((card) => {
        const searchOk = !query || card.dataset.search.includes(query);
        card.hidden = card.dataset.filterHidden === "true" || !searchOk;
      });
    }

    async function postForm(url, form, statusId) {
      await postJson(url, Object.fromEntries(new FormData(form)), statusId);
    }

    function discoverySourceLabel(value) {
      const labels = {
        reddit_rss: "Reddit RSS 新发现",
        search: "公开搜索结果",
        search_import: "搜索结果导入",
        manual: "人工收集",
        outreach_log: "已有外联日志"
      };
      return labels[value] || value || "Not recorded";
    }

    function discoveryModeLabel(value) {
      if (value === "public_discovery") return "公开发现模式";
      return "已有外联日志 + 人工收集 + 搜索结果导入";
    }

    async function postJson(url, body, statusTarget) {
      const status = typeof statusTarget === "string" ? document.getElementById(statusTarget) : statusTarget;
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error(await response.text());
        status.textContent = "已保存。重新运行 runtime 后会进入看板。";
      } catch (error) {
        status.textContent = "Local Growth OS server is not available. Changes cannot be saved.";
      }
    }

    function formatDate(value) {
      return value ? new Date(value).toLocaleString() : "unknown";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }
  </script>
</body>
</html>
